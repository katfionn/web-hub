<style>
/* ============================================================
   Design tokens — inspired by ASUS / Apple / OpenRouter / Google
   ============================================================ */
:root{
  --canvas:#ffffff;
  --surface:#ffffff;
  --surface-soft:#f5f6f8;
  --surface-muted:#eef0f4;
  --ink:#0e1420;
  --ink-secondary:#5c6573;
  --ink-muted:#8b93a3;
  --line:#e4e8ee;
  --line-strong:#cfd6e0;
  --accent:#005bff;
  --accent-hover:#0047cc;
  --accent-soft:#e5eeff;
  --accent-ink:#003ebc;
  --ring:rgba(0,91,255,.18);
  --shadow-card:0 1px 2px rgba(14,20,32,.03);
  --shadow-hover:0 12px 28px -10px rgba(14,20,32,.12),0 2px 6px rgba(14,20,32,.04);
  --radius-sm:10px;
  --radius-md:14px;
  --radius-lg:20px;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --font-text:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --font-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}

[data-theme="dark"]{
  --canvas:#0d1015;
  --surface:#14181f;
  --surface-soft:#1a1f28;
  --surface-muted:#20262f;
  --ink:#f0f3f8;
  --ink-secondary:#9aa4b5;
  --ink-muted:#667080;
  --line:#252c37;
  --line-strong:#354050;
  --accent:#6b9aff;
  --accent-hover:#8bb2ff;
  --accent-soft:#16233d;
  --accent-ink:#c7d9ff;
  --ring:rgba(107,154,255,.22);
  --shadow-card:0 1px 2px rgba(0,0,0,.35);
  --shadow-hover:0 14px 34px -12px rgba(0,0,0,.6),0 2px 8px rgba(0,0,0,.25);
}

/* ============================================================
   Base
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:var(--font-text);
  background:var(--canvas);
  color:var(--ink);
  font-size:15px;
  line-height:1.6;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  transition:background-color .35s ease,color .35s ease;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
::selection{background:var(--accent-soft);color:var(--accent-ink)}

/* ============================================================
   Topbar — Apple-like quiet, ASUS-like clarity
   ============================================================ */
.topbar{
  position:sticky;
  top:0;
  z-index:100;
  background:color-mix(in srgb, var(--canvas) 78%, transparent);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{
  max-width:1200px;
  margin:0 auto;
  padding:16px 28px;
  display:flex;
  align-items:center;
  gap:14px;
}

/* Brand */
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}
.brand-mark{
  width:36px;height:36px;flex:0 0 auto;
  display:grid;place-items:center;
  border-radius:10px;
  background:var(--accent);
  color:#fff;
  box-shadow:0 2px 8px -2px var(--ring);
}
.brand-mark svg{display:block}

.brand-copy{min-width:0}
.brand-title{
  margin:0;
  font-family:var(--font-display);
  font-size:16px;
  font-weight:650;
  letter-spacing:-.022em;
  line-height:1.25;
  color:var(--ink);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  display:flex;
  align-items:baseline;
  gap:0;
}
.repo-link{
  color:var(--ink);
  border-bottom:1px solid transparent;
  transition:color .2s,border-color .2s;
}
.repo-link:hover{
  color:var(--accent);
  border-bottom-color:var(--accent);
}
.brand-title .suffix{
  font-weight:480;
  color:var(--ink-secondary);
}
.brand-sub{
  margin:2px 0 0;
  font-size:11px;
  font-weight:450;
  letter-spacing:.02em;
  color:var(--ink-muted);
  line-height:1.35;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* Search — Google Support-like centrality, but compact */
.search{
  position:relative;
  flex:1;
  max-width:360px;
  margin-left:auto;
}
.search .s-icon{
  position:absolute;
  left:13px;
  top:50%;
  transform:translateY(-50%);
  color:var(--ink-muted);
  pointer-events:none;
  display:flex;
}
.search input{
  width:100%;
  height:40px;
  padding:0 40px 0 40px;
  border-radius:var(--radius-sm);
  border:1px solid var(--line-strong);
  background:var(--surface-soft);
  color:var(--ink);
  font-size:13.5px;
  font-family:var(--font-text);
  outline:none;
  transition:border-color .2s,background .2s,box-shadow .2s;
  -webkit-appearance:none;
}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.search input::placeholder{color:var(--ink-muted)}
.search input:focus{
  background:var(--surface);
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--ring);
}
.search kbd{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  font-size:11px;
  line-height:1;
  padding:3px 6px;
  border-radius:5px;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink-muted);
  font-family:var(--font-text);
  pointer-events:none;
}

/* Icon buttons */
.icon-btn{
  width:38px;height:38px;
  flex:0 0 auto;
  display:grid;place-items:center;
  border-radius:var(--radius-sm);
  border:1px solid var(--line);
  background:transparent;
  color:var(--ink-secondary);
  cursor:pointer;
  transition:background .2s,color .2s,border-color .2s,transform .15s;
}
.icon-btn:hover{background:var(--surface-soft);color:var(--ink);border-color:var(--line-strong)}
.icon-btn:active{transform:scale(.94)}
.icon-btn:disabled{cursor:default;opacity:.5}
.icon-btn.spinning svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.icon-sun{display:none}
[data-theme="dark"] .icon-sun{display:block}
[data-theme="dark"] .icon-moon{display:none}

/* ============================================================
   Main
   ============================================================ */
.container{
  max-width:1200px;
  margin:0 auto;
  padding:44px 28px 80px;
}

/* Toolbar — ASUS-like section framing */
.toolbar{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:20px;
  flex-wrap:wrap;
  margin-bottom:28px;
  padding-bottom:18px;
  border-bottom:1px solid var(--line);
}
.toolbar-left{display:flex;align-items:baseline;gap:12px;min-width:0}
.toolbar-left h2{
  margin:0;
  font-family:var(--font-display);
  font-size:24px;
  font-weight:680;
  letter-spacing:-.025em;
  line-height:1.2;
  color:var(--ink);
}
.count{
  font-size:11.5px;
  font-weight:550;
  letter-spacing:.02em;
  color:var(--ink-muted);
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.toolbar-right{
  font-size:11.5px;
  color:var(--ink-muted);
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
  font-family:var(--font-mono);
}

/* ============================================================
   Grid & Cards — Apple breathing + OpenRouter technical clarity
   ============================================================ */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(264px,1fr));
  gap:14px;
}

.card{
  position:relative;
  display:flex;
  flex-direction:column;
  gap:18px;
  padding:20px;
  border-radius:var(--radius-md);
  border:1px solid var(--line);
  background:var(--surface);
  box-shadow:var(--shadow-card);
  transition:transform .22s cubic-bezier(.2,.8,.2,1),
             box-shadow .22s cubic-bezier(.2,.8,.2,1),
             border-color .22s;
  animation:fadeUp .4s cubic-bezier(.2,.8,.2,1) both;
  overflow:hidden;
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}
.card:hover{
  transform:translateY(-2px);
  box-shadow:var(--shadow-hover);
  border-color:var(--line-strong);
}
.card:active{transform:translateY(0) scale(.996)}
.card:focus-visible{
  outline:none;
  box-shadow:0 0 0 3px var(--ring);
}

.card-head{display:flex;gap:13px;align-items:flex-start}
.card-icon{
  width:38px;height:38px;
  flex:0 0 auto;
  border-radius:11px;
  display:grid;place-items:center;
  font-size:14px;
  font-weight:680;
  line-height:1;
  color:var(--accent-ink);
  background:var(--accent-soft);
  border:1px solid color-mix(in srgb, var(--accent) 18%, var(--line));
  user-select:none;
  font-family:var(--font-display);
}
.card-body{min-width:0;flex:1}

.card-title{
  font-family:var(--font-display);
  font-size:14.5px;
  font-weight:640;
  letter-spacing:-.01em;
  line-height:1.4;
  color:var(--ink);
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  word-break:break-word;
}
.card-desc{
  margin:4px 0 0;
  font-size:12.5px;
  line-height:1.55;
  color:var(--ink-secondary);
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  word-break:break-word;
}

.card-foot{
  margin-top:auto;
  display:flex;
  align-items:center;
  gap:8px;
  padding-top:14px;
  border-top:1px solid var(--line);
  font-size:11px;
  color:var(--ink-muted);
  font-family:var(--font-mono);
  min-width:0;
}
.card-path{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  min-width:0;
}
.card-arrow{
  margin-left:auto;
  flex:0 0 auto;
  color:var(--ink-muted);
  font-family:var(--font-mono);
  transition:transform .22s cubic-bezier(.2,.8,.2,1),color .22s;
}
.card:hover .card-arrow{
  transform:translateX(2px);
  color:var(--accent);
}

/* ============================================================
   Skeleton
   ============================================================ */
.skeleton{
  height:126px;
  border-radius:var(--radius-md);
  border:1px solid var(--line);
  background:var(--surface);
  position:relative;
  overflow:hidden;
}
.skeleton::after{
  content:"";
  position:absolute;
  inset:0;
  transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,var(--surface-soft),transparent);
  animation:shimmer 1.4s infinite;
}
@keyframes shimmer{100%{transform:translateX(100%)}}

/* ============================================================
   State boxes — Google Support-like spacious
   ============================================================ */
.state-box{
  text-align:center;
  padding:88px 28px;
  border-radius:var(--radius-md);
  border:1px solid var(--line);
  background:var(--surface-soft);
}
.state-box h3{
  margin:0 0 10px;
  font-family:var(--font-display);
  font-size:18px;
  font-weight:660;
  letter-spacing:-.015em;
  color:var(--ink);
}
.state-box p{
  margin:0 auto;
  max-width:460px;
  font-size:13.5px;
  color:var(--ink-secondary);
  line-height:1.7;
}
.state-icon{
  font-size:24px;
  line-height:1;
  margin-bottom:18px;
  opacity:.7;
}
.state-box .hint{
  margin-top:16px;
  font-size:12.5px;
  color:var(--ink-muted);
}
.state-box code{
  font-family:var(--font-mono);
  font-size:11.5px;
  padding:2px 6px;
  border-radius:5px;
  background:var(--surface);
  border:1px solid var(--line);
  color:var(--ink-secondary);
}
.btn{
  margin-top:24px;
  height:38px;
  padding:0 20px;
  border-radius:var(--radius-sm);
  border:1px solid var(--accent);
  background:var(--accent);
  color:#fff;
  font-size:13.5px;
  font-weight:580;
  cursor:pointer;
  transition:background .2s,transform .15s;
  box-shadow:0 2px 8px -2px var(--ring);
}
.btn:hover{background:var(--accent-hover)}
.btn:active{transform:scale(.97)}

/* ============================================================
   Responsive
   ============================================================ */
@media (max-width:720px){
  .topbar-inner{flex-wrap:wrap;padding:14px 18px;gap:10px}
  .search{order:3;flex-basis:100%;max-width:none;margin-left:0}
  .icon-btn{width:36px;height:36px}
  .brand{margin-right:auto}
  .container{padding:32px 18px 64px}
  .toolbar-left h2{font-size:21px}
  .grid{grid-template-columns:1fr;gap:10px}
  .card{padding:18px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>

<body>

<!-- ================= TOPBAR ================= -->
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3.5" y="3.5" width="6.5" height="6.5" rx="1.2"/>
          <rect x="14" y="3.5" width="6.5" height="6.5" rx="1.2"/>
          <rect x="3.5" y="14" width="6.5" height="6.5" rx="1.2"/>
          <rect x="14" y="14" width="6.5" height="6.5" rx="1.2"/>
        </svg>
      </div>
      <div class="brand-copy">
        <p class="brand-title" id="brand-title">
          <a class="repo-link" id="repo-link" href="#" target="_blank" rel="noopener noreferrer">项目</a><span class="suffix">导览</span>
        </p>
        <p class="brand-sub" id="brand-sub">GitHub 仓库 html 子项目导览</p>
      </div>
    </div>

    <div class="search">
      <span class="s-icon" aria-hidden="true">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
        </svg>
      </span>
      <input id="search-input" type="search" placeholder="搜索页面…" autocomplete="off" spellcheck="false" aria-label="搜索页面">
      <kbd>/</kbd>
    </div>

    <button class="icon-btn" id="refresh-btn" title="重新扫描" aria-label="重新扫描">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>
      </svg>
    </button>

    <button class="icon-btn" id="theme-btn" title="切换主题" aria-label="切换主题">
      <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
      <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="4.2"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
    </button>
  </div>
</header>

<!-- ================= MAIN ================= -->
<main class="container">
  <div class="toolbar">
    <div class="toolbar-left">
      <h2>全部页面</h2>
      <span class="count" id="count">—</span>
    </div>
    <div class="toolbar-right" id="meta"></div>
  </div>

  <div id="grid" class="grid"></div>

  <div id="empty" class="state-box" hidden>
    <div class="state-icon">▦</div>
    <h3>还没有可索引的页面</h3>
    <p>把带 <code>index.html</code> 的文件夹放到仓库里，刷新一下就能看到。</p>
  </div>

  <div id="noresult" class="state-box" hidden>
    <div class="state-icon">⌕</div>
    <h3>没有匹配的页面</h3>
    <p>换个关键词试试，或者清空搜索框。</p>
  </div>

  <div id="error" class="state-box" hidden>
    <div class="state-icon">⚠</div>
    <h3>无法自动扫描</h3>
    <p id="error-msg"></p>
    <p class="hint">
      请在文件顶部 <code>CONFIG</code> 中填写 <code>owner</code> / <code>repo</code>，
      或在仓库根目录放置一个 <code>pages.json</code> 手动列出页面。
    </p>
    <button class="btn" id="retry-btn">重试</button>
  </div>
</main>

<script>
(function () {
  'use strict';

  /* =========================================================
   *  配置区
   * ========================================================= */
  const CONFIG = {
    siteSuffix: '项目导览',              // 标题后半段（前半段为仓库名）
    siteSubtitle: 'GitHub 仓库 html 子项目导览',

    owner: 'katfionn',
    repo: 'web-hub',
    branch: 'main',

    entryFiles: ['index.html', 'index.htm'],
    ignoreDirs: ['node_modules', 'dist', 'build', 'vendor', '.git', '.github', '.idea', '.vscode'],
    maxDepth: 8,
    concurrency: 8,
    cacheMinutes: 30
  };
  /* ========================================================= */

  const CACHE_KEY = 'pages-index:cache:v2';
  const THEME_KEY = 'pages-index:theme';

  const state = {
    pages: [],
    loading: true,
    error: null,
    scannedAt: 0
  };

  let cardEls = [];
  let $grid, $count, $meta, $empty, $noresult, $error, $errorMsg, $search;

  /* ---------------- helpers ---------------- */

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function hash(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
    return Math.abs(h);
  }

  function initialOf(str) {
    const s = String(str || '').trim();
    if (!s) return '#';
    const ch = s[0];
    return /[\u4e00-\u9fa5]/.test(ch) ? ch : ch.toUpperCase();
  }

  function titleFromDir(dir) {
    const segs = String(dir || '').split('/').filter(Boolean);
    return segs.length ? segs[segs.length - 1] : dir;
  }

  function encodePath(p) {
    return p.split('/').map(encodeURIComponent).join('/');
  }

  async function fetchWithTimeout(url, ms, opts) {
    const ctrl = new AbortController();
    const timer = setTimeout(function () { ctrl.abort(); }, ms || 15000);
    try {
      return await fetch(url, Object.assign({}, opts, { signal: ctrl.signal }));
    } finally {
      clearTimeout(timer);
    }
  }

  async function mapLimit(items, limit, fn) {
    let i = 0;
    const workers = Array.from({ length: Math.min(limit, items.length) }, async function () {
      while (true) {
        const idx = i++;
        if (idx >= items.length) return;
        await fn(items[idx], idx);
      }
    });
    await Promise.all(workers);
  }

  /* ---------------- theme ---------------- */

  function setTheme(t) {
    document.documentElement.dataset.theme = t;
  }

  function initTheme() {
    let saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
    const sys = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    setTheme(saved || sys);

    document.getElementById('theme-btn').addEventListener('click', function () {
      const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      setTheme(next);
      try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    });
  }

  /* ---------------- repo resolution ---------------- */

  function resolveRepo() {
    let owner = (CONFIG.owner || '').trim();
    let repo = (CONFIG.repo || '').trim();
    if (owner && repo) return { owner: owner, repo: repo };

    const host = location.hostname;
    const segs = location.pathname.split('/').filter(Boolean);

    if (/\.github\.io$/i.test(host)) {
      const sub = host.replace(/\.github\.io$/i, '');
      if (!owner) owner = sub;
      if (!repo) repo = segs.length > 0 ? segs[0] : (sub + '.github.io');
    }
    return { owner: owner, repo: repo };
  }

  function renderBrand() {
    const r = resolveRepo();
    const repoLink = document.getElementById('repo-link');
    const brandTitle = document.getElementById('brand-title');

    const displayName = r.repo || r.owner || '项目';

    if (r.owner && r.repo) {
      repoLink.textContent = displayName;
      repoLink.href = 'https://github.com/' + encodeURIComponent(r.owner) + '/' + encodeURIComponent(r.repo);
      repoLink.target = '_blank';
      repoLink.rel = 'noopener noreferrer';
      repoLink.title = '在新标签页打开 ' + r.owner + '/' + r.repo;
    } else {
      repoLink.textContent = displayName;
      repoLink.removeAttribute('href');
      repoLink.style.cursor = 'default';
      repoLink.style.borderBottom = 'none';
    }

    const suffix = document.createElement('span');
    suffix.className = 'suffix';
    suffix.textContent = CONFIG.siteSuffix;
    brandTitle.innerHTML = '';
    brandTitle.appendChild(repoLink);
    brandTitle.appendChild(suffix);

    document.getElementById('brand-sub').textContent = CONFIG.siteSubtitle;
    document.title = displayName + ' · ' + CONFIG.siteSuffix;
  }

  /* ---------------- scanning ---------------- */

  async function fetchTree(owner, repo) {
    const branches = CONFIG.branch ? [CONFIG.branch] : ['main', 'master'];
    let lastErr = null;

    for (let i = 0; i < branches.length; i++) {
      const br = branches[i];
      const url = 'https://api.github.com/repos/' + encodeURIComponent(owner) + '/' + encodeURIComponent(repo) +
        '/git/trees/' + encodeURIComponent(br) + '?recursive=1';

      let res;
      try {
        res = await fetchWithTimeout(url, 15000, { headers: { 'Accept': 'application/vnd.github+json' } });
      } catch (e) {
        lastErr = new Error('网络请求失败：' + e.message);
        continue;
      }

      if (res.ok) {
        const data = await res.json();
        if (data.truncated) console.warn('[pages-index] tree truncated');
        return (data.tree || []).filter(function (t) { return t.type === 'blob'; }).map(function (t) { return t.path; });
      }

      if (res.status === 403 || res.status === 429) {
        lastErr = new Error('GitHub API 触发速率限制（匿名请求每小时 60 次），请稍后再试。');
      } else if (res.status === 404) {
        lastErr = new Error('仓库或分支不存在：' + owner + '/' + repo + ' @ ' + br);
      } else {
        lastErr = new Error('GitHub API 返回 HTTP ' + res.status);
      }
    }
    throw lastErr || new Error('无法读取仓库文件树');
  }

  function pathsToPages(paths) {
    const seen = Object.create(null);
    const out = [];

    for (let i = 0; i < paths.length; i++) {
      const segs = String(paths[i]).split('/');
      const file = segs.pop().toLowerCase();
      if (CONFIG.entryFiles.indexOf(file) === -1) continue;
      if (segs.length === 0) continue;
      if (segs.length > CONFIG.maxDepth) continue;

      let skip = false;
      for (let j = 0; j < segs.length; j++) {
        const s = segs[j];
        if (s.charAt(0) === '.' || CONFIG.ignoreDirs.indexOf(s.toLowerCase()) !== -1) { skip = true; break; }
      }
      if (skip) continue;

      const dir = segs.join('/');
      if (seen[dir]) continue;
      seen[dir] = true;
      out.push({ dir: dir, title: '', desc: '' });
    }

    out.sort(function (a, b) {
      return a.dir.localeCompare(b.dir, 'zh-Hans-CN', { numeric: true });
    });
    return out;
  }

  async function loadManifest() {
    let res;
    try { res = await fetchWithTimeout('pages.json', 8000, { cache: 'no-cache' }); }
    catch (e) { throw new Error('未找到 pages.json'); }
    if (!res.ok) throw new Error('未找到 pages.json');

    let data;
    try { data = await res.json(); }
    catch (e) { throw new Error('pages.json 格式不是合法 JSON'); }

    const arr = Array.isArray(data) ? data : (data && data.pages) || [];
    return arr.map(function (item) {
      if (typeof item === 'string') {
        return { dir: item.replace(/^\.?\//, '').replace(/\/$/, ''), title: '', desc: '' };
      }
      return {
        dir: String(item.path != null ? item.path : (item.dir || '')).replace(/^\.?\//, '').replace(/\/$/, ''),
        title: item.title || '',
        desc: item.desc || item.description || ''
      };
    }).filter(function (x) { return !!x.dir; });
  }

  async function findPages() {
    const r = resolveRepo();
    if (r.owner && r.repo) {
      try {
        const paths = await fetchTree(r.owner, r.repo);
        return pathsToPages(paths);
      } catch (err) {
        try { return await loadManifest(); }
        catch (e2) { throw err; }
      }
    }
    return await loadManifest();
  }

  /* ---------------- meta extraction ---------------- */

  async function fetchMeta(dir) {
    for (let i = 0; i < CONFIG.entryFiles.length; i++) {
      const url = encodePath(dir) + '/' + CONFIG.entryFiles[i];
      let res;
      try { res = await fetchWithTimeout(url, 15000); }
      catch (e) { continue; }
      if (!res.ok) continue;

      let html;
      try { html = await res.text(); }
      catch (e) { continue; }

      try {
        const doc = new DOMParser().parseFromString(html, 'text/html');
        let title = (doc.title || '').trim();
        if (!title) {
          const h1 = doc.querySelector('h1');
          if (h1) title = (h1.textContent || '').trim();
        }
        const metaDesc = doc.querySelector('meta[name="description"]');
        const desc = metaDesc ? (metaDesc.getAttribute('content') || '').trim() : '';
        return { title: title, desc: desc };
      } catch (e) { return { title: '', desc: '' }; }
    }
    return { title: '', desc: '' };
  }

  /* ---------------- cache ---------------- */

  function cacheScope() { return location.origin + location.pathname; }

  function readCache() {
    try {
      const raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      const obj = JSON.parse(raw);
      if (!obj || obj.scope !== cacheScope()) return null;
      if (Date.now() - obj.time > CONFIG.cacheMinutes * 60000) return null;
      if (!Array.isArray(obj.pages) || obj.pages.length === 0) return null;
      return obj;
    } catch (e) { return null; }
  }

  function writeCache() {
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({ scope: cacheScope(), time: Date.now(), pages: state.pages }));
    } catch (e) {}
  }

  /* ---------------- rendering ---------------- */

  function renderSkeletons(n) {
    $grid.innerHTML = '';
    for (let i = 0; i < n; i++) {
      const d = document.createElement('div');
      d.className = 'skeleton';
      $grid.appendChild(d);
    }
  }

  function createCard(page, index) {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = encodePath(page.dir) + '/';
    a.style.animationDelay = Math.min(index, 20) * 20 + 'ms';

    const title = page.title || titleFromDir(page.dir);
    const iconSeed = titleFromDir(page.dir);

    a.innerHTML =
      '<div class="card-head">' +
        '<div class="card-icon">' + escapeHtml(initialOf(iconSeed)) + '</div>' +
        '<div class="card-body">' +
          '<div class="card-title" data-role="title">' + escapeHtml(title) + '</div>' +
          '<p class="card-desc" data-role="desc"' + (page.desc ? '' : ' hidden') + '>' + escapeHtml(page.desc || '') + '</p>' +
        '</div>' +
      '</div>' +
      '<div class="card-foot">' +
        '<span class="card-path">' + escapeHtml(page.dir) + '/</span>' +
        '<span class="card-arrow">→</span>' +
      '</div>';

    return a;
  }

  function renderCards() {
    $grid.innerHTML = '';
    cardEls = [];
    const frag = document.createDocumentFragment();
    for (let i = 0; i < state.pages.length; i++) {
      const card = createCard(state.pages[i], i);
      frag.appendChild(card);
      cardEls.push(card);
    }
    $grid.appendChild(frag);
  }

  function updateCardText(index) {
    const card = cardEls[index];
    const page = state.pages[index];
    if (!card || !page) return;
    const titleEl = card.querySelector('[data-role="title"]');
    const descEl = card.querySelector('[data-role="desc"]');
    if (titleEl) titleEl.textContent = page.title || titleFromDir(page.dir);
    if (descEl) {
      if (page.desc) { descEl.textContent = page.desc; descEl.hidden = false; }
      else descEl.hidden = true;
    }
  }

  function applyFilter() {
    const q = ($search.value || '').trim().toLowerCase();
    let visible = 0;

    for (let i = 0; i < state.pages.length; i++) {
      const card = cardEls[i];
      if (!card) continue;
      const p = state.pages[i];
      const hay = ((p.title || '') + ' ' + p.dir + ' ' + (p.desc || '')).toLowerCase();
      const hit = !q || hay.indexOf(q) !== -1;
      card.style.display = hit ? '' : 'none';
      if (hit) visible++;
    }

    $count.textContent = q ? visible + ' / ' + state.pages.length : state.pages.length + ' 个页面';
    $noresult.hidden = !(q && visible === 0 && state.pages.length > 0);
    $grid.hidden = visible === 0 && state.pages.length > 0;
  }

  function updateMetaTime() {
    if (!state.scannedAt) { $meta.textContent = ''; return; }
    const d = new Date(state.scannedAt);
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    $meta.textContent = hh + ':' + mm;
  }

  function render() {
    $empty.hidden = true;
    $noresult.hidden = true;
    $error.hidden = true;

    if (state.loading) {
      $grid.hidden = false;
      renderSkeletons(8);
      $count.textContent = '扫描中…';
      $meta.textContent = '';
      return;
    }

    if (state.error) {
      $grid.hidden = true;
      $grid.innerHTML = '';
      $error.hidden = false;
      $errorMsg.textContent = state.error;
      $count.textContent = '—';
      $meta.textContent = '';
      return;
    }

    if (state.pages.length === 0) {
      $grid.hidden = true;
      $grid.innerHTML = '';
      $empty.hidden = false;
      $count.textContent = '0 个页面';
      $meta.textContent = '';
      return;
    }

    $grid.hidden = false;
    renderCards();
    applyFilter();
    updateMetaTime();
  }

  /* ---------------- main flow ---------------- */

  async function scan() {
    state.loading = true;
    state.error = null;
    state.pages = [];
    render();

    let entries;
    try { entries = await findPages(); }
    catch (err) {
      state.loading = false;
      state.error = err && err.message ? err.message : String(err);
      render();
      return;
    }

    if (!entries.length) {
      state.loading = false;
      state.pages = [];
      state.scannedAt = Date.now();
      render();
      return;
    }

    state.pages = entries.map(function (e) {
      return { dir: e.dir, title: e.title || '', desc: e.desc || '' };
    });
    state.loading = false;
    render();

    let done = 0;
    const total = state.pages.length;

    await mapLimit(entries, CONFIG.concurrency, async function (entry, index) {
      if (!state.pages[index].title) {
        const meta = await fetchMeta(entry.dir);
        if (meta.title) state.pages[index].title = meta.title;
        if (meta.desc) state.pages[index].desc = meta.desc;
      }
      done++;
      updateCardText(index);
      $meta.textContent = done + '/' + total;
    });

    state.scannedAt = Date.now();
    applyFilter();
    updateMetaTime();
    writeCache();
  }

  async function boot() {
    $grid = document.getElementById('grid');
    $count = document.getElementById('count');
    $meta = document.getElementById('meta');
    $empty = document.getElementById('empty');
    $noresult = document.getElementById('noresult');
    $error = document.getElementById('error');
    $errorMsg = document.getElementById('error-msg');
    $search = document.getElementById('search-input');

    initTheme();
    renderBrand();

    $search.addEventListener('input', applyFilter);

    document.addEventListener('keydown', function (e) {
      const tag = (document.activeElement && document.activeElement.tagName) || '';
      const typing = tag === 'INPUT' || tag === 'TEXTAREA';
      if (e.key === '/' && !typing) { e.preventDefault(); $search.focus(); }
      if (e.key === 'Escape' && document.activeElement === $search) {
        $search.value = '';
        $search.blur();
        applyFilter();
      }
    });

    const refreshBtn = document.getElementById('refresh-btn');
    refreshBtn.addEventListener('click', async function () {
      if (refreshBtn.disabled) return;
      refreshBtn.disabled = true;
      refreshBtn.classList.add('spinning');
      try { localStorage.removeItem(CACHE_KEY); } catch (e) {}
      await scan();
      refreshBtn.disabled = false;
      refreshBtn.classList.remove('spinning');
    });

    document.getElementById('retry-btn').addEventListener('click', function () {
      try { localStorage.removeItem(CACHE_KEY); } catch (e) {}
      scan();
    });

    const cached = readCache();
    if (cached) {
      state.pages = cached.pages;
      state.scannedAt = cached.time;
      state.loading = false;
      render();
      return;
    }

    await scan();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
