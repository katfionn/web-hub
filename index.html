<style>
/* ============================================================
   Design tokens
   ============================================================ */
:root{
  --canvas:#f8fafc;
  --surface:#ffffff;
  --surface-soft:#f1f5f9;
  --surface-muted:#e2e8f0;
  --surface-glass:rgba(255,255,255,.78);
  --ink:#090d16;
  --ink-secondary:#475569;
  --ink-muted:#94a3b8;
  --line:rgba(15,23,42,.08);
  --line-strong:rgba(15,23,42,.15);
  --specular:rgba(255,255,255,.9);
  --accent:#2563eb;
  --accent-hover:#1d4ed8;
  --accent-soft:rgba(37,99,235,.08);
  --accent-ink:#1e40af;
  --ring:rgba(37,99,235,.18);
  --spotlight:rgba(37,99,235,.055);
  --ambient-top:rgba(37,99,235,.07);
  --grid-dot:rgba(15,23,42,.04);
  --shadow-card:0 1px 2px rgba(9,13,22,.03),0 4px 12px -2px rgba(9,13,22,.04),inset 0 1px 0 var(--specular);
  --shadow-hover:0 18px 38px -12px rgba(9,13,22,.10),0 4px 14px -2px rgba(9,13,22,.05),inset 0 1px 0 var(--specular);
  --radius-sm:10px;
  --radius-md:16px;
  --radius-lg:22px;
  --font-display:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --font-text:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}

[data-theme="dark"]{
  --canvas:#07090e;
  --surface:#0f131c;
  --surface-soft:#161b26;
  --surface-muted:#1e2534;
  --surface-glass:rgba(15,19,28,.75);
  --ink:#f1f5f9;
  --ink-secondary:#94a3b8;
  --ink-muted:#64748b;
  --line:rgba(255,255,255,.07);
  --line-strong:rgba(255,255,255,.15);
  --specular:rgba(255,255,255,.05);
  --accent:#60a5fa;
  --accent-hover:#93c5fd;
  --accent-soft:rgba(96,165,250,.12);
  --accent-ink:#bfdbfe;
  --ring:rgba(96,165,250,.22);
  --spotlight:rgba(96,165,250,.08);
  --ambient-top:rgba(59,130,246,.12);
  --grid-dot:rgba(255,255,255,.03);
  --shadow-card:0 2px 6px rgba(0,0,0,.35),inset 0 1px 0 var(--specular);
  --shadow-hover:0 20px 42px -12px rgba(0,0,0,.68),0 4px 16px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.09);
}

/* ============================================================
   Base & Ambient Canvas
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  position:relative;
  margin:0;
  font-family:var(--font-text);
  background-color:var(--canvas);
  color:var(--ink);
  font-size:15px;
  line-height:1.6;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  transition:background-color .35s ease,color .35s ease;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  background-image:
    radial-gradient(ellipse 80% 420px at 50% -10%,var(--ambient-top),transparent 75%),
    linear-gradient(to right,var(--grid-dot) 1px,transparent 1px),
    linear-gradient(to bottom,var(--grid-dot) 1px,transparent 1px);
  background-size:100% 100%,32px 32px,32px 32px;
  mask-image:radial-gradient(ellipse 95% 75% at 50% 0%,#000 35%,transparent 100%);
  -webkit-mask-image:radial-gradient(ellipse 95% 75% at 50% 0%,#000 35%,transparent 100%);
}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
::selection{background:var(--accent-soft);color:var(--accent-ink)}

/* ============================================================
   Topbar
   ============================================================ */
.topbar{
  position:sticky;
  top:0;
  z-index:100;
  background:var(--surface-glass);
  backdrop-filter:saturate(190%) blur(22px);
  -webkit-backdrop-filter:saturate(190%) blur(22px);
  border-bottom:1px solid var(--line);
  box-shadow:0 1px 0 var(--specular);
}
.topbar-inner{
  max-width:1120px;
  margin:0 auto;
  padding:12px 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

/* Brand */
.brand{
  display:flex;
  align-items:center;
}
.brand-mark{
  position:relative;
  width:38px;height:38px;flex:0 0 auto;
  display:grid;place-items:center;
  border-radius:11px;
  background:var(--surface);
  color:var(--ink);
  border:1px solid var(--line);
  box-shadow:var(--shadow-card);
  transition:transform .22s cubic-bezier(.2,.8,.2,1),border-color .2s,background .2s,color .2s;
}
.brand-mark:hover{
  transform:translateY(-1px);
  background:var(--surface-soft);
  border-color:var(--line-strong);
  color:var(--accent);
}
.brand-mark:active{transform:scale(.95)}
.brand-mark:focus-visible{outline:none;box-shadow:0 0 0 3px var(--ring)}
.brand-mark svg{display:block}

.topbar-actions{
  display:flex;
  align-items:center;
  gap:10px;
  margin-left:auto;
}

/* Icon buttons */
.icon-btn{
  width:38px;height:38px;
  flex:0 0 auto;
  display:grid;place-items:center;
  border-radius:var(--radius-sm);
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink-secondary);
  box-shadow:var(--shadow-card);
  cursor:pointer;
  transition:background .2s,color .2s,border-color .2s,transform .15s,box-shadow .2s;
}
.icon-btn:hover{
  background:var(--surface-soft);
  color:var(--ink);
  border-color:var(--line-strong);
}
.icon-btn:active{transform:scale(.94)}
.icon-btn:focus-visible{outline:none;box-shadow:0 0 0 3px var(--ring)}
.icon-btn:disabled{cursor:default;opacity:.5}
.icon-btn.spinning svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.icon-sun{display:none}
[data-theme="dark"] .icon-sun{display:block}
[data-theme="dark"] .icon-moon{display:none}

/* ============================================================
   Main & Hero
   ============================================================ */
.container{
  position:relative;
  z-index:1;
  max-width:1120px;
  margin:0 auto;
  padding:44px 28px 96px;
}

.hero{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  margin-bottom:44px;
}

/* Top Pill Badge */
.hero-pill{
  display:inline-flex;
  align-items:center;
  gap:10px;
  height:32px;
  padding:0 14px;
  border-radius:999px;
  border:1px solid var(--line-strong);
  background:var(--surface);
  box-shadow:var(--shadow-card);
  font-size:12px;
  font-weight:500;
  color:var(--ink-secondary);
  margin-bottom:20px;
}
.hero-pill-text{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:360px;
}
.hero-pill-icons{
  display:inline-flex;
  align-items:center;
  gap:5px;
  color:var(--ink);
}
.hero-pill-icons .spark{color:#f97316}
.hero-pill-icons span{
  display:inline-grid;
  place-items:center;
  width:18px;height:18px;
  border-radius:5px;
  background:var(--surface-soft);
  border:1px solid var(--line);
}

/* Hero Title */
.brand-title{
  margin:0 0 26px;
  font-family:var(--font-display);
  font-size:clamp(26px,3.6vw,34px);
  font-weight:720;
  letter-spacing:-.03em;
  line-height:1.2;
  color:var(--ink);
  display:inline-flex;
  align-items:baseline;
  justify-content:center;
  flex-wrap:wrap;
  gap:6px;
}
.repo-link{
  color:var(--ink);
  border-bottom:2px solid transparent;
  transition:color .2s,border-color .2s;
}
.repo-link:hover{
  color:var(--accent);
  border-bottom-color:var(--accent);
}
.brand-title .suffix{
  font-weight:520;
  color:var(--ink-secondary);
}
.brand-title .suffix::before{
  content:"/";
  margin-right:6px;
  color:var(--ink-muted);
  opacity:.55;
  font-weight:400;
}

/* Search Bar */
.search-shell{
  width:100%;
  max-width:780px;
  padding:5px;
  border-radius:16px;
  background:color-mix(in srgb,var(--surface-soft) 70%,transparent);
  border:1px solid var(--line);
  box-shadow:0 4px 20px -6px rgba(9,13,22,.05);
  transition:border-color .2s,background .2s,box-shadow .2s;
}
.search-shell:focus-within{
  border-color:color-mix(in srgb,var(--accent) 40%,var(--line));
  background:var(--accent-soft);
  box-shadow:0 8px 28px -6px var(--ring);
}
.search{
  position:relative;
  width:100%;
}
.search .s-icon{
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  color:var(--ink-muted);
  pointer-events:none;
  display:flex;
  transition:color .2s;
}
.search:focus-within .s-icon{
  color:var(--accent);
}
.search input{
  width:100%;
  height:42px;
  padding:0 54px 0 42px;
  border-radius:11px;
  border:1px solid var(--line-strong);
  background:var(--surface);
  color:var(--ink);
  font-size:14px;
  font-family:var(--font-text);
  outline:none;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.02);
  transition:border-color .2s,background .2s,box-shadow .2s;
  -webkit-appearance:none;
}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.search input::placeholder{color:var(--ink-muted)}
.search input:focus{
  border-color:var(--accent);
}
.search kbd{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  font-size:11px;
  font-weight:600;
  line-height:1;
  padding:4px 7px;
  border-radius:6px;
  border:1px solid var(--line-strong);
  background:var(--surface-soft);
  color:var(--ink-secondary);
  font-family:var(--font-mono);
  box-shadow:0 1px 0 var(--line);
  pointer-events:none;
  transition:border-color .2s,color .2s;
}
.search:focus-within kbd{
  border-color:color-mix(in srgb,var(--accent) 35%,var(--line));
  color:var(--accent);
}

/* ============================================================
   Toolbar
   ============================================================ */
.toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
  margin-bottom:18px;
  padding-bottom:12px;
  border-bottom:1px solid var(--line);
}
.toolbar-left{display:flex;align-items:center;gap:10px;min-width:0}
.toolbar-left h2{
  margin:0;
  font-family:var(--font-display);
  font-size:15px;
  font-weight:650;
  letter-spacing:-.01em;
  line-height:1.2;
  color:var(--ink-secondary);
  display:inline-flex;
  align-items:center;
  gap:4px;
}
.toolbar-left h2::after{
  content:"›";
  font-size:16px;
  color:var(--ink-muted);
  font-weight:500;
}
.count{
  display:inline-flex;
  align-items:center;
  height:22px;
  padding:0 9px;
  border-radius:999px;
  background:var(--accent-soft);
  border:1px solid color-mix(in srgb,var(--accent) 18%,transparent);
  font-size:11px;
  font-weight:600;
  letter-spacing:.01em;
  color:var(--accent-ink);
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.toolbar-right{
  display:inline-flex;
  align-items:center;
  gap:7px;
  font-size:11px;
  color:var(--ink-muted);
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
  font-family:var(--font-mono);
  padding:3px 9px;
  border-radius:999px;
  background:var(--surface-soft);
  border:1px solid var(--line);
}
.toolbar-right:empty{display:none}
.toolbar-right::before{
  content:"";
  width:6px;height:6px;
  border-radius:50%;
  background:#10b981;
  box-shadow:0 0 0 3px rgba(16,185,129,.18);
}

/* ============================================================
   Grid & Cards
   ============================================================ */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(272px,1fr));
  gap:14px;
}

.card{
  --card-hue:218;
  --mx:50%;
  --my:0%;
  position:relative;
  display:flex;
  flex-direction:column;
  gap:16px;
  padding:20px;
  border-radius:var(--radius-md);
  border:1px solid var(--line);
  background:var(--surface);
  box-shadow:var(--shadow-card);
  transition:transform .26s cubic-bezier(.2,.8,.2,1),
             box-shadow .26s cubic-bezier(.2,.8,.2,1),
             border-color .26s ease;
  animation:fadeUp .42s cubic-bezier(.2,.8,.2,1) both;
  overflow:hidden;
  isolation:isolate;
}
.card::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  background:radial-gradient(380px circle at var(--mx) var(--my),var(--spotlight),transparent 70%);
  opacity:0;
  transition:opacity .3s ease;
  pointer-events:none;
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(10px) scale(.99)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.card:hover{
  transform:translateY(-3px);
  box-shadow:var(--shadow-hover);
  border-color:color-mix(in srgb,var(--accent) 32%,var(--line-strong));
}
.card:hover::before{
  opacity:1;
}
.card:active{transform:translateY(-1px) scale(.995)}
.card:focus-visible{
  outline:none;
  border-color:var(--accent);
  box-shadow:0 0 0 3.5px var(--ring),var(--shadow-hover);
}

.card-head{display:flex;gap:13px;align-items:flex-start}
.card-icon{
  width:40px;height:40px;
  flex:0 0 auto;
  border-radius:11px;
  display:grid;place-items:center;
  font-size:14.5px;
  font-weight:700;
  line-height:1;
  color:hsl(var(--card-hue) 78% 38%);
  background:linear-gradient(145deg,hsl(var(--card-hue) 90% 96%),hsl(var(--card-hue) 85% 91%));
  border:1px solid hsl(var(--card-hue) 70% 84%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 2px 6px -2px hsla(var(--card-hue),70%,40%,.14);
  user-select:none;
  font-family:var(--font-display);
  transition:transform .26s cubic-bezier(.2,.8,.2,1),box-shadow .26s ease;
}
[data-theme="dark"] .card-icon{
  color:hsl(var(--card-hue) 88% 78%);
  background:linear-gradient(145deg,hsla(var(--card-hue),75%,55%,.18),hsla(var(--card-hue),75%,45%,.08));
  border-color:hsla(var(--card-hue),80%,65%,.24);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 2px 8px -2px rgba(0,0,0,.4);
}
.card:hover .card-icon{
  transform:scale(1.05);
}

.card-body{min-width:0;flex:1;padding-top:1px}
.card-title{
  font-family:var(--font-display);
  font-size:14.5px;
  font-weight:650;
  letter-spacing:-.014em;
  line-height:1.4;
  color:var(--ink);
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  word-break:break-word;
  transition:color .2s;
}
.card:hover .card-title{
  color:var(--accent);
}
.card-desc{
  margin:4px 0 0;
  font-size:12.5px;
  line-height:1.55;
  color:var(--ink-secondary);
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  word-break:break-word;
}

.card-foot{
  margin-top:auto;
  display:flex;
  align-items:center;
  gap:10px;
  padding-top:13px;
  border-top:1px solid var(--line);
  font-size:11.5px;
  color:var(--ink-muted);
  font-family:var(--font-mono);
  min-width:0;
}
.card-path{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  min-width:0;
  padding:2px 8px;
  border-radius:6px;
  background:var(--surface-soft);
  border:1px solid var(--line);
  color:var(--ink-secondary);
  transition:background .2s,color .2s,border-color .2s;
}
.card:hover .card-path{
  background:var(--accent-soft);
  border-color:color-mix(in srgb,var(--accent) 20%,transparent);
  color:var(--accent-ink);
}
.card-arrow{
  margin-left:auto;
  width:24px;height:24px;
  border-radius:7px;
  display:grid;place-items:center;
  flex:0 0 auto;
  color:var(--ink-muted);
  font-family:var(--font-mono);
  background:transparent;
  transition:transform .24s cubic-bezier(.2,.8,.2,1),color .2s,background .2s;
}
.card:hover .card-arrow{
  transform:translateX(2px);
  color:var(--accent);
  background:var(--accent-soft);
}

/* ============================================================
   Skeleton
   ============================================================ */
.skeleton{
  height:136px;
  border-radius:var(--radius-md);
  border:1px solid var(--line);
  background-color:var(--surface);
  box-shadow:var(--shadow-card);
  position:relative;
  overflow:hidden;
  background-image:
    linear-gradient(var(--surface-soft),var(--surface-soft)),
    linear-gradient(var(--surface-soft),var(--surface-soft)),
    linear-gradient(var(--surface-soft),var(--surface-soft)),
    linear-gradient(var(--surface-soft),var(--surface-soft));
  background-repeat:no-repeat;
  background-size:
    40px 40px,
    52% 14px,
    36% 11px,
    44% 18px;
  background-position:
    20px 20px,
    74px 23px,
    74px 45px,
    20px 96px;
}
.skeleton::after{
  content:"";
  position:absolute;
  inset:0;
  transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--surface-muted) 55%,transparent),transparent);
  animation:shimmer 1.5s infinite;
}
@keyframes shimmer{100%{transform:translateX(100%)}}

/* ============================================================
   State boxes
   ============================================================ */
.state-box{
  text-align:center;
  padding:72px 28px;
  border-radius:var(--radius-lg);
  border:1px dashed var(--line-strong);
  background:color-mix(in srgb,var(--surface) 75%,var(--surface-soft));
  box-shadow:var(--shadow-card);
}
.state-box h3{
  margin:0 0 10px;
  font-family:var(--font-display);
  font-size:18px;
  font-weight:660;
  letter-spacing:-.015em;
  color:var(--ink);
}
.state-box p{
  margin:0 auto;
  max-width:460px;
  font-size:13.5px;
  color:var(--ink-secondary);
  line-height:1.7;
}
.state-icon{
  width:52px;height:52px;
  margin:0 auto 18px;
  border-radius:14px;
  display:grid;place-items:center;
  font-size:22px;
  line-height:1;
  color:var(--accent);
  background:var(--accent-soft);
  border:1px solid color-mix(in srgb,var(--accent) 20%,transparent);
  box-shadow:inset 0 1px 0 var(--specular);
}
.state-box .hint{
  margin-top:16px;
  font-size:12.5px;
  color:var(--ink-muted);
}
.state-box code{
  font-family:var(--font-mono);
  font-size:11.5px;
  padding:2.5px 7px;
  border-radius:6px;
  background:var(--surface);
  border:1px solid var(--line-strong);
  color:var(--ink);
}
.btn{
  margin-top:24px;
  height:38px;
  padding:0 22px;
  border-radius:var(--radius-sm);
  border:1px solid var(--accent);
  background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 92%,#fff),var(--accent));
  color:#fff;
  font-size:13.5px;
  font-weight:600;
  cursor:pointer;
  transition:background .2s,transform .15s,box-shadow .2s;
  box-shadow:0 4px 12px -2px var(--ring),inset 0 1px 0 rgba(255,255,255,.25);
}
.btn:hover{background:var(--accent-hover)}
.btn:active{transform:scale(.97)}

/* ============================================================
   Extension Widgets (Abstracted & Hidden by Default)
   ============================================================ */
.ext-widgets{
  margin-top:42px;
  display:flex;
  flex-direction:column;
  gap:32px;
}
.ext-widgets[hidden]{
  display:none !important;
}

/* 1. Feature Banner Component */
.promo-shell{
  padding:5px;
  border-radius:18px;
  background:color-mix(in srgb,var(--surface-soft) 65%,transparent);
  border:1px solid var(--line);
}
.promo-card{
  display:flex;
  align-items:center;
  gap:20px;
  padding:6px 22px 6px 6px;
  border-radius:13px;
  border:1px solid var(--line-strong);
  background:var(--surface);
  box-shadow:var(--shadow-card);
}
.promo-art{
  width:92px;height:82px;
  flex:0 0 auto;
  border-radius:10px;
  background:
    radial-gradient(circle at 80% 80%,rgba(255,215,170,.45),transparent 55%),
    repeating-linear-gradient(-35deg,rgba(255,255,255,.12) 0 2px,transparent 2px 6px),
    linear-gradient(135deg,#f97316 0%,#ea580c 55%,#fb923c 100%);
  position:relative;
  overflow:hidden;
}
.promo-art::after{
  content:"";
  position:absolute;
  inset:12px -18px -18px 18px;
  border-radius:50%;
  border:1.5px dashed rgba(255,255,255,.45);
}
.promo-body{
  flex:1;
  min-width:0;
  padding:8px 0;
}
.promo-head{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}
.promo-title{
  margin:0;
  font-family:var(--font-display);
  font-size:14.5px;
  font-weight:660;
  color:var(--ink);
}
.avatar-group{
  display:inline-flex;
  align-items:center;
}
.avatar-dot{
  width:20px;height:20px;
  border-radius:50%;
  border:1.5px solid var(--surface);
  margin-left:-6px;
  font-size:9px;
  font-weight:700;
  color:#fff;
  display:inline-grid;
  place-items:center;
}
.avatar-dot:first-child{margin-left:0;background:#10b981}
.avatar-dot:nth-child(2){background:#3b82f6}
.avatar-dot:nth-child(3){background:#8b5cf6}
.avatar-dot:nth-child(4){background:#ec4899}
.avatar-dot.arrow{
  background:var(--surface-soft);
  color:var(--ink-secondary);
  border-color:var(--line-strong);
  font-family:var(--font-mono);
}
.promo-desc{
  margin:4px 0 0;
  font-size:12.5px;
  color:var(--ink-secondary);
  line-height:1.5;
  max-width:560px;
}
.promo-cta{
  flex:0 0 auto;
  height:36px;
  padding:0 16px;
  border-radius:9px;
  border:1px solid #ea580c;
  background:#f97316;
  color:#fff;
  font-size:12.5px;
  font-weight:600;
  cursor:pointer;
  transition:background .2s,transform .15s;
}
.promo-cta:hover{background:#ea580c}
.promo-cta:active{transform:scale(.97)}

/* 2. Notice Card Component */
.widget-sec{
  display:flex;
  flex-direction:column;
  gap:12px;
}
.widget-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.widget-bar-left{
  display:flex;
  align-items:center;
  gap:8px;
}
.widget-bar-title{
  margin:0;
  font-family:var(--font-display);
  font-size:15px;
  font-weight:680;
  color:var(--ink);
}
.widget-badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:20px;
  height:20px;
  padding:0 6px;
  border-radius:999px;
  background:var(--surface-muted);
  color:var(--ink-secondary);
  font-size:11px;
  font-weight:650;
}
.widget-bar-right{
  display:flex;
  align-items:center;
  gap:8px;
}
.ctrl-btn{
  height:30px;
  padding:0 11px;
  border-radius:8px;
  border:1px solid var(--line-strong);
  background:var(--surface);
  color:var(--ink-secondary);
  font-size:12px;
  font-weight:520;
  display:inline-flex;
  align-items:center;
  gap:6px;
  cursor:pointer;
  box-shadow:var(--shadow-card);
  transition:background .2s,color .2s,border-color .2s;
}
.ctrl-btn:hover{
  background:var(--surface-soft);
  color:var(--ink);
}
.ctrl-btn.icon-only{
  width:30px;
  padding:0;
  justify-content:center;
}
.ctrl-ghost{
  height:30px;
  padding:0 10px;
  border-radius:8px;
  border:none;
  background:transparent;
  color:var(--ink-secondary);
  font-size:12.5px;
  cursor:pointer;
  transition:color .2s,background .2s;
}
.ctrl-ghost:hover{
  color:var(--ink);
  background:var(--surface-soft);
}

.rec-card{
  display:flex;
  align-items:center;
  gap:14px;
  padding:16px 20px;
  border-radius:13px;
  border:1px solid var(--line-strong);
  background:var(--surface);
  box-shadow:var(--shadow-card);
}
.rec-icon{
  width:36px;height:36px;
  flex:0 0 auto;
  border-radius:50%;
  background:rgba(239,68,68,.08);
  border:1px solid rgba(239,68,68,.2);
  color:#dc2626;
  display:grid;
  place-items:center;
}
[data-theme="dark"] .rec-icon{
  color:#f87171;
  background:rgba(248,113,113,.12);
}
.rec-body{
  flex:1;
  min-width:0;
}
.rec-title{
  margin:0;
  font-size:13.5px;
  font-weight:650;
  color:var(--ink);
}
.rec-sub{
  margin:2px 0 0;
  font-size:12px;
  color:var(--ink-muted);
}
.rec-actions{
  display:flex;
  align-items:center;
  gap:8px;
  flex:0 0 auto;
}

/* 3. Dual Metrics Component */
.analytics-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}
.metric-card{
  padding:20px;
  border-radius:14px;
  border:1px solid var(--line-strong);
  background:var(--surface);
  box-shadow:var(--shadow-card);
  display:flex;
  flex-direction:column;
  gap:14px;
}
.metric-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}
.metric-label{
  font-size:12px;
  color:var(--ink-secondary);
  margin:0 0 4px;
}
.metric-val-row{
  display:flex;
  align-items:baseline;
  gap:8px;
}
.metric-val{
  font-family:var(--font-display);
  font-size:24px;
  font-weight:700;
  letter-spacing:-.02em;
  color:var(--ink);
}
.metric-delta{
  font-size:11.5px;
  font-weight:600;
  font-variant-numeric:tabular-nums;
}
.metric-delta.down{color:#dc2626}
.metric-delta.up{color:#059669}
[data-theme="dark"] .metric-delta.down{color:#f87171}
[data-theme="dark"] .metric-delta.up{color:#34d399}

.chart-box{
  position:relative;
  height:120px;
  padding-right:34px;
  display:flex;
  align-items:flex-end;
}
.chart-lines{
  position:absolute;
  inset:12px 0 0 0;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  pointer-events:none;
}
.chart-line{
  border-top:1px solid var(--line);
  position:relative;
}
.chart-line span{
  position:absolute;
  right:0;
  top:-9px;
  font-size:10.5px;
  color:var(--ink-muted);
  font-family:var(--font-mono);
}
.chart-svg{
  width:100%;
  height:100%;
  overflow:visible;
  position:relative;
  z-index:1;
}

/* ============================================================
   README Section
   ============================================================ */
.readme-section{
  margin-bottom:32px;
  border-radius:var(--radius-lg);
  border:1px solid var(--line);
  background:var(--surface);
  box-shadow:var(--shadow-card);
  overflow:hidden;
  transition:all .3s cubic-bezier(.2,.8,.2,1);
}
.readme-section[hidden]{
  display:none;
}
.readme-section.collapsed .readme-content{
  max-height:0;
  padding:0 24px;
  opacity:0;
}
.readme-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 20px;
  background:var(--surface-soft);
  border-bottom:1px solid var(--line);
  transition:background .2s;
}
.readme-section.collapsed .readme-header{
  border-bottom:none;
}
.readme-header-left{
  display:flex;
  align-items:center;
  gap:12px;
}
.readme-icon{
  width:36px;
  height:36px;
  border-radius:10px;
  display:grid;
  place-items:center;
  background:var(--accent-soft);
  border:1px solid color-mix(in srgb,var(--accent) 20%,transparent);
  color:var(--accent);
}
.readme-title{
  margin:0;
  font-family:var(--font-display);
  font-size:15px;
  font-weight:650;
  letter-spacing:-.01em;
  color:var(--ink);
}
.readme-toggle{
  transition:transform .3s cubic-bezier(.2,.8,.2,1);
}
.readme-section.collapsed .readme-toggle{
  transform:rotate(180deg);
}
.readme-content{
  max-height:600px;
  padding:24px;
  overflow-y:auto;
  transition:all .3s cubic-bezier(.2,.8,.2,1);
  font-size:14px;
  line-height:1.7;
  color:var(--ink);
}
.readme-content::-webkit-scrollbar{
  width:8px;
}
.readme-content::-webkit-scrollbar-track{
  background:transparent;
}
.readme-content::-webkit-scrollbar-thumb{
  background:var(--surface-muted);
  border-radius:4px;
}
.readme-content::-webkit-scrollbar-thumb:hover{
  background:var(--ink-muted);
}
.readme-loading{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  padding:40px;
  color:var(--ink-secondary);
}
.readme-spinner{
  width:20px;
  height:20px;
  border:2px solid var(--line-strong);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin .8s linear infinite;
}
.readme-error{
  padding:40px;
  text-align:center;
  color:var(--ink-secondary);
}
.readme-error-icon{
  width:40px;
  height:40px;
  margin:0 auto 12px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:rgba(239,68,68,.08);
  border:1px solid rgba(239,68,68,.2);
  color:#dc2626;
}
[data-theme="dark"] .readme-error-icon{
  color:#f87171;
  background:rgba(248,113,113,.12);
}

/* README Markdown Styles */
.readme-content h1,.readme-content h2,.readme-content h3,
.readme-content h4,.readme-content h5,.readme-content h6{
  margin:1.5em 0 .5em;
  font-family:var(--font-display);
  font-weight:650;
  letter-spacing:-.015em;
  color:var(--ink);
  line-height:1.3;
}
.readme-content h1{font-size:1.8em;border-bottom:2px solid var(--line);padding-bottom:.3em}
.readme-content h2{font-size:1.5em;border-bottom:1px solid var(--line);padding-bottom:.3em}
.readme-content h3{font-size:1.25em}
.readme-content h4{font-size:1.1em}
.readme-content h1:first-child,.readme-content h2:first-child,
.readme-content h3:first-child{margin-top:0}
.readme-content p{
  margin:1em 0;
  color:var(--ink);
}
.readme-content a{
  color:var(--accent);
  text-decoration:none;
  border-bottom:1px solid transparent;
  transition:border-color .2s;
}
.readme-content a:hover{
  border-bottom-color:var(--accent);
}
.readme-content code{
  font-family:var(--font-mono);
  font-size:.9em;
  padding:2px 6px;
  border-radius:4px;
  background:var(--surface-soft);
  border:1px solid var(--line);
  color:var(--accent-ink);
}
.readme-content pre{
  margin:1em 0;
  padding:16px;
  border-radius:var(--radius-sm);
  background:var(--surface-soft);
  border:1px solid var(--line);
  overflow-x:auto;
}
.readme-content pre code{
  padding:0;
  border:none;
  background:transparent;
  color:var(--ink);
}
.readme-content ul,.readme-content ol{
  margin:1em 0;
  padding-left:2em;
}
.readme-content li{
  margin:.3em 0;
}
.readme-content blockquote{
  margin:1em 0;
  padding:0 1em;
  border-left:3px solid var(--line-strong);
  color:var(--ink-secondary);
}
.readme-content img{
  max-width:100%;
  height:auto;
  border-radius:var(--radius-sm);
  border:1px solid var(--line);
  margin:1em 0;
}
.readme-content table{
  width:100%;
  margin:1em 0;
  border-collapse:collapse;
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  overflow:hidden;
}
.readme-content th,.readme-content td{
  padding:8px 12px;
  border:1px solid var(--line);
  text-align:left;
}
.readme-content th{
  background:var(--surface-soft);
  font-weight:600;
  color:var(--ink);
}
.readme-content hr{
  margin:2em 0;
  border:none;
  border-top:1px solid var(--line);
}

/* ============================================================
   Responsive
   ============================================================ */
@media (max-width:720px){
  .topbar-inner{padding:12px 18px}
  .icon-btn{width:36px;height:36px}
  .container{padding:28px 18px 64px}
  .hero{margin-bottom:32px}
  .grid{grid-template-columns:1fr;gap:12px}
  .card{padding:18px}
  .promo-card{flex-direction:column;align-items:flex-start;padding:14px}
  .promo-art{width:100%;height:68px}
  .rec-card{flex-wrap:wrap}
  .rec-actions{width:100%;justify-content:flex-end}
  .analytics-grid{grid-template-columns:1fr}
  .readme-content{padding:18px;max-height:400px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>

<body>

<!-- ================= TOPBAR ================= -->
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <a class="brand-mark" id="github-link" href="https://github.com" target="_blank" rel="noopener noreferrer" title="打开 GitHub 个人主页" aria-label="GitHub 个人主页">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844a9.59 9.59 0 0 1 2.504.337c1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.02 10.02 0 0 0 22 12.017C22 6.484 17.522 2 12 2Z"/>
        </svg>
      </a>
    </div>

    <div class="topbar-actions">
      <button class="icon-btn" id="refresh-btn" title="重新扫描" aria-label="重新扫描">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>
        </svg>
      </button>

      <button class="icon-btn" id="theme-btn" title="切换主题" aria-label="切换主题">
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4.2"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<!-- ================= MAIN ================= -->
<main class="container">

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-pill">
      <span class="hero-pill-text" id="brand-sub">GitHub 仓库 html 子项目导览</span>
      <span class="hero-pill-icons" aria-hidden="true">
        <svg class="spark" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
        </svg>
        <span>
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>
          </svg>
        </span>
        <span>
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
          </svg>
        </span>
      </span>
    </div>

    <h1 class="brand-title" id="brand-title">
      <a class="repo-link" id="repo-link" href="#" target="_blank" rel="noopener noreferrer">项目</a><span class="suffix">导览</span>
    </h1>

    <div class="search-shell">
      <div class="search">
        <span class="s-icon" aria-hidden="true">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
          </svg>
        </span>
        <input id="search-input" type="search" placeholder="搜索页面或目录路径…" autocomplete="off" spellcheck="false" aria-label="搜索页面">
        <kbd>/</kbd>
      </div>
    </div>
  </section>

  <!-- README Section -->
  <section id="readme-section" class="readme-section" hidden>
    <div class="readme-header">
      <div class="readme-header-left">
        <div class="readme-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>
          </svg>
        </div>
        <h2 class="readme-title">README.md</h2>
      </div>
      <button class="readme-toggle icon-btn" id="readme-toggle" title="折叠 README" aria-label="折叠 README">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="18 15 12 9 6 15"/>
        </svg>
      </button>
    </div>
    <div class="readme-content" id="readme-content">
      <div class="readme-loading">
        <div class="readme-spinner"></div>
        <span>加载 README 中...</span>
      </div>
    </div>
  </section>

  <!-- Pages Directory Section -->
  <div class="toolbar">
    <div class="toolbar-left">
      <h2>全部页面</h2>
      <span class="count" id="count">—</span>
    </div>
    <div class="toolbar-right" id="meta"></div>
  </div>

  <div id="grid" class="grid"></div>

  <div id="empty" class="state-box" hidden>
    <div class="state-icon">▦</div>
    <h3>还没有可索引的页面</h3>
    <p>把带 <code>index.html</code> 的文件夹放到仓库里，刷新一下就能看到。</p>
  </div>

  <div id="noresult" class="state-box" hidden>
    <div class="state-icon">⌕</div>
    <h3>没有匹配的页面</h3>
    <p>换个关键词试试，或者按 <code>Esc</code> 清空搜索框。</p>
  </div>

  <div id="error" class="state-box" hidden>
    <div class="state-icon">⚠</div>
    <h3>无法自动扫描</h3>
    <p id="error-msg"></p>
    <p class="hint">
      请在文件顶部 <code>CONFIG</code> 中填写 <code>owner</code> / <code>repo</code>，
      或在仓库根目录放置一个 <code>pages.json</code> 手动列出页面。
    </p>
    <button class="btn" id="retry-btn">重试</button>
  </div>

</main>

<script>
(function () {
  'use strict';

  /* =========================================================
   *  配置区
   * ========================================================= */
  const CONFIG = {
    siteSuffix: '项目导览',               // 标题后半段（前半段为仓库名）
    siteSubtitle: 'GitHub 仓库 html 子项目导览',

    owner: 'katfionn',
    repo: 'web-hub',
    branch: 'main',

    entryFiles: ['index.html', 'index.htm'],
    ignoreDirs: ['node_modules', 'dist', 'build', 'vendor', '.git', '.github', '.idea', '.vscode'],
    maxDepth: 8,
    concurrency: 8,
    cacheMinutes: 30,
    showWidgets: false                   // 扩展概览组件开关（默认隐藏）
  };
  /* ========================================================= */

  const CACHE_KEY = 'pages-index:cache:v2';
  const THEME_KEY = 'pages-index:theme';

  const state = {
    pages: [],
    loading: true,
    error: null,
    scannedAt: 0
  };

  let cardEls = [];
  let $grid, $count, $meta, $empty, $noresult, $error, $errorMsg, $search, $extWidgets;
  let $readmeSection, $readmeContent, $readmeToggle;

  /* ---------------- helpers ---------------- */

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function hash(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
    return Math.abs(h);
  }

  function initialOf(str) {
    const s = String(str || '').trim();
    if (!s) return '#';
    const ch = s[0];
    return /[\u4e00-\u9fa5]/.test(ch) ? ch : ch.toUpperCase();
  }

  function titleFromDir(dir) {
    const segs = String(dir || '').split('/').filter(Boolean);
    return segs.length ? segs[segs.length - 1] : dir;
  }

  function encodePath(p) {
    return p.split('/').map(encodeURIComponent).join('/');
  }

  async function fetchWithTimeout(url, ms, opts) {
    const ctrl = new AbortController();
    const timer = setTimeout(function () { ctrl.abort(); }, ms || 15000);
    try {
      return await fetch(url, Object.assign({}, opts, { signal: ctrl.signal }));
    } finally {
      clearTimeout(timer);
    }
  }

  async function mapLimit(items, limit, fn) {
    let i = 0;
    const workers = Array.from({ length: Math.min(limit, items.length) }, async function () {
      while (true) {
        const idx = i++;
        if (idx >= items.length) return;
        await fn(items[idx], idx);
      }
    });
    await Promise.all(workers);
  }

  /* ---------------- theme ---------------- */

  function setTheme(t) {
    document.documentElement.dataset.theme = t;
  }

  function initTheme() {
    let saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
    const sys = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    setTheme(saved || sys);

    document.getElementById('theme-btn').addEventListener('click', function () {
      const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      setTheme(next);
      try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    });
  }

  /* ---------------- repo resolution ---------------- */

  function resolveRepo() {
    let owner = (CONFIG.owner || '').trim();
    let repo = (CONFIG.repo || '').trim();
    if (owner && repo) return { owner: owner, repo: repo };

    const host = location.hostname;
    const segs = location.pathname.split('/').filter(Boolean);

    if (/\.github\.io$/i.test(host)) {
      const sub = host.replace(/\.github\.io$/i, '');
      if (!owner) owner = sub;
      if (!repo) repo = segs.length > 0 ? segs[0] : (sub + '.github.io');
    }
    return { owner: owner, repo: repo };
  }

  function renderBrand() {
    const r = resolveRepo();
    const githubLink = document.getElementById('github-link');
    const repoLink = document.getElementById('repo-link');
    const brandTitle = document.getElementById('brand-title');

    if (githubLink) {
      if (r.owner) {
        githubLink.href = 'https://github.com/' + encodeURIComponent(r.owner);
        githubLink.title = '在新标签页打开 ' + r.owner + ' 的 GitHub 主页';
      } else {
        githubLink.href = 'https://github.com';
      }
    }

    const displayName = r.repo || r.owner || '项目';

    if (r.owner && r.repo) {
      repoLink.textContent = displayName;
      repoLink.href = 'https://github.com/' + encodeURIComponent(r.owner) + '/' + encodeURIComponent(r.repo);
      repoLink.target = '_blank';
      repoLink.rel = 'noopener noreferrer';
      repoLink.title = '在新标签页打开 ' + r.owner + '/' + r.repo;
    } else {
      repoLink.textContent = displayName;
      repoLink.removeAttribute('href');
      repoLink.style.cursor = 'default';
      repoLink.style.borderBottom = 'none';
    }

    const suffix = document.createElement('span');
    suffix.className = 'suffix';
    suffix.textContent = CONFIG.siteSuffix;
    brandTitle.innerHTML = '';
    brandTitle.appendChild(repoLink);
    brandTitle.appendChild(suffix);

    document.getElementById('brand-sub').textContent = CONFIG.siteSubtitle;
    document.title = displayName + ' · ' + CONFIG.siteSuffix;
  }

  /* ---------------- scanning ---------------- */

  async function fetchTree(owner, repo) {
    const branches = CONFIG.branch ? [CONFIG.branch] : ['main', 'master'];
    let lastErr = null;

    for (let i = 0; i < branches.length; i++) {
      const br = branches[i];
      const url = 'https://api.github.com/repos/' + encodeURIComponent(owner) + '/' + encodeURIComponent(repo) +
        '/git/trees/' + encodeURIComponent(br) + '?recursive=1';

      let res;
      try {
        res = await fetchWithTimeout(url, 15000, { headers: { 'Accept': 'application/vnd.github+json' } });
      } catch (e) {
        lastErr = new Error('网络请求失败：' + e.message);
        continue;
      }

      if (res.ok) {
        const data = await res.json();
        if (data.truncated) console.warn('[pages-index] tree truncated');
        return (data.tree || []).filter(function (t) { return t.type === 'blob'; }).map(function (t) { return t.path; });
      }

      if (res.status === 403 || res.status === 429) {
        lastErr = new Error('GitHub API 触发速率限制（匿名请求每小时 60 次），请稍后再试。');
      } else if (res.status === 404) {
        lastErr = new Error('仓库或分支不存在：' + owner + '/' + repo + ' @ ' + br);
      } else {
        lastErr = new Error('GitHub API 返回 HTTP ' + res.status);
      }
    }
    throw lastErr || new Error('无法读取仓库文件树');
  }

  function pathsToPages(paths) {
    const seen = Object.create(null);
    const out = [];

    for (let i = 0; i < paths.length; i++) {
      const segs = String(paths[i]).split('/');
      const file = segs.pop().toLowerCase();
      if (CONFIG.entryFiles.indexOf(file) === -1) continue;
      if (segs.length === 0) continue;
      if (segs.length > CONFIG.maxDepth) continue;

      let skip = false;
      for (let j = 0; j < segs.length; j++) {
        const s = segs[j];
        if (s.charAt(0) === '.' || CONFIG.ignoreDirs.indexOf(s.toLowerCase()) !== -1) { skip = true; break; }
      }
      if (skip) continue;

      const dir = segs.join('/');
      if (seen[dir]) continue;
      seen[dir] = true;
      out.push({ dir: dir, title: '', desc: '' });
    }

    out.sort(function (a, b) {
      return a.dir.localeCompare(b.dir, 'zh-Hans-CN', { numeric: true });
    });
    return out;
  }

  async function loadManifest() {
    let res;
    try { res = await fetchWithTimeout('pages.json', 8000, { cache: 'no-cache' }); }
    catch (e) { throw new Error('未找到 pages.json'); }
    if (!res.ok) throw new Error('未找到 pages.json');

    let data;
    try { data = await res.json(); }
    catch (e) { throw new Error('pages.json 格式不是合法 JSON'); }

    const arr = Array.isArray(data) ? data : (data && data.pages) || [];
    return arr.map(function (item) {
      if (typeof item === 'string') {
        return { dir: item.replace(/^\.?\//, '').replace(/\/$/, ''), title: '', desc: '' };
      }
      return {
        dir: String(item.path != null ? item.path : (item.dir || '')).replace(/^\.?\//, '').replace(/\/$/, ''),
        title: item.title || '',
        desc: item.desc || item.description || ''
      };
    }).filter(function (x) { return !!x.dir; });
  }

  async function findPages() {
    const r = resolveRepo();
    if (r.owner && r.repo) {
      try {
        const paths = await fetchTree(r.owner, r.repo);
        return pathsToPages(paths);
      } catch (err) {
        try { return await loadManifest(); }
        catch (e2) { throw err; }
      }
    }
    return await loadManifest();
  }

  /* ---------------- README fetching & rendering ---------------- */

  async function fetchReadme(owner, repo, branch) {
    const branches = branch ? [branch] : ['main', 'master'];

    for (let i = 0; i < branches.length; i++) {
      const br = branches[i];
      const url = 'https://raw.githubusercontent.com/' +
        encodeURIComponent(owner) + '/' +
        encodeURIComponent(repo) + '/' +
        encodeURIComponent(br) + '/README.md';

      try {
        const res = await fetchWithTimeout(url, 10000);
        if (res.ok) {
          return await res.text();
        }
      } catch (e) {
        continue;
      }
    }
    throw new Error('未找到 README.md 文件');
  }

  function parseMarkdown(md) {
    let html = escapeHtml(md);

    // Headers
    html = html.replace(/^######\s+(.+)$/gm, '<h6>$1</h6>');
    html = html.replace(/^#####\s+(.+)$/gm, '<h5>$1</h5>');
    html = html.replace(/^####\s+(.+)$/gm, '<h4>$1</h4>');
    html = html.replace(/^###\s+(.+)$/gm, '<h3>$1</h3>');
    html = html.replace(/^##\s+(.+)$/gm, '<h2>$1</h2>');
    html = html.replace(/^#\s+(.+)$/gm, '<h1>$1</h1>');

    // Code blocks
    html = html.replace(/```(\w+)?\n([\s\S]*?)```/g, function(_, lang, code) {
      return '<pre><code>' + code + '</code></pre>';
    });

    // Inline code (after code blocks)
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

    // Bold
    html = html.replace(/\*\*([^\*]+)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/__([^_]+)__/g, '<strong>$1</strong>');

    // Italic
    html = html.replace(/\*([^\*]+)\*/g, '<em>$1</em>');
    html = html.replace(/_([^_]+)_/g, '<em>$1</em>');

    // Links
    html = html.replace(/\[([^\]]+)\]\(([^\)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');

    // Images
    html = html.replace(/!\[([^\]]*)\]\(([^\)]+)\)/g, '<img src="$2" alt="$1" loading="lazy">');

    // Horizontal rules
    html = html.replace(/^(?:---|\*\*\*|___)$/gm, '<hr>');

    // Unordered lists
    html = html.replace(/^\*\s+(.+)$/gm, '<li>$1</li>');
    html = html.replace(/^-\s+(.+)$/gm, '<li>$1</li>');
    html = html.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');

    // Ordered lists
    html = html.replace(/^\d+\.\s+(.+)$/gm, '<li>$1</li>');

    // Blockquotes
    html = html.replace(/^&gt;\s+(.+)$/gm, '<blockquote>$1</blockquote>');

    // Line breaks to paragraphs
    const lines = html.split('\n');
    let result = [];
    let para = [];

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i].trim();
      if (!line) {
        if (para.length > 0) {
          const joined = para.join(' ');
          if (!joined.match(/^<(h[1-6]|pre|ul|ol|blockquote|hr|table)/)) {
            result.push('<p>' + joined + '</p>');
          } else {
            result.push(joined);
          }
          para = [];
        }
      } else {
        if (line.match(/^<(h[1-6]|pre|ul|ol|blockquote|hr|table)/)) {
          if (para.length > 0) {
            result.push('<p>' + para.join(' ') + '</p>');
            para = [];
          }
          result.push(line);
        } else {
          para.push(line);
        }
      }
    }

    if (para.length > 0) {
      const joined = para.join(' ');
      if (!joined.match(/^<(h[1-6]|pre|ul|ol|blockquote|hr|table)/)) {
        result.push('<p>' + joined + '</p>');
      } else {
        result.push(joined);
      }
    }

    return result.join('\n');
  }

  async function loadReadme() {
    const r = resolveRepo();
    if (!r.owner || !r.repo) {
      $readmeSection.hidden = true;
      return;
    }

    $readmeSection.hidden = false;
    $readmeContent.innerHTML = '<div class="readme-loading"><div class="readme-spinner"></div><span>加载 README 中...</span></div>';

    try {
      const markdown = await fetchReadme(r.owner, r.repo, CONFIG.branch);
      const html = parseMarkdown(markdown);
      $readmeContent.innerHTML = html;
    } catch (err) {
      $readmeContent.innerHTML =
        '<div class="readme-error">' +
          '<div class="readme-error-icon">' +
            '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
              '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>' +
            '</svg>' +
          '</div>' +
          '<p>' + escapeHtml(err.message || '加载 README 失败') + '</p>' +
        '</div>';
    }
  }

  function initReadmeToggle() {
    if (!$readmeToggle || !$readmeSection) return;

    $readmeToggle.addEventListener('click', function() {
      const isCollapsed = $readmeSection.classList.contains('collapsed');
      if (isCollapsed) {
        $readmeSection.classList.remove('collapsed');
        $readmeToggle.title = '折叠 README';
        $readmeToggle.setAttribute('aria-label', '折叠 README');
      } else {
        $readmeSection.classList.add('collapsed');
        $readmeToggle.title = '展开 README';
        $readmeToggle.setAttribute('aria-label', '展开 README');
      }
    });
  }

  /* ---------------- meta extraction ---------------- */

  async function fetchMeta(dir) {
    for (let i = 0; i < CONFIG.entryFiles.length; i++) {
      const url = encodePath(dir) + '/' + CONFIG.entryFiles[i];
      let res;
      try { res = await fetchWithTimeout(url, 15000); }
      catch (e) { continue; }
      if (!res.ok) continue;

      let html;
      try { html = await res.text(); }
      catch (e) { continue; }

      try {
        const doc = new DOMParser().parseFromString(html, 'text/html');
        let title = (doc.title || '').trim();
        if (!title) {
          const h1 = doc.querySelector('h1');
          if (h1) title = (h1.textContent || '').trim();
        }
        const metaDesc = doc.querySelector('meta[name="description"]');
        const desc = metaDesc ? (metaDesc.getAttribute('content') || '').trim() : '';
        return { title: title, desc: desc };
      } catch (e) { return { title: '', desc: '' }; }
    }
    return { title: '', desc: '' };
  }

  /* ---------------- cache ---------------- */

  function cacheScope() { return location.origin + location.pathname; }

  function readCache() {
    try {
      const raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      const obj = JSON.parse(raw);
      if (!obj || obj.scope !== cacheScope()) return null;
      if (Date.now() - obj.time > CONFIG.cacheMinutes * 60000) return null;
      if (!Array.isArray(obj.pages) || obj.pages.length === 0) return null;
      return obj;
    } catch (e) { return null; }
  }

  function writeCache() {
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({ scope: cacheScope(), time: Date.now(), pages: state.pages }));
    } catch (e) {}
  }

          '<button type="button" class="ctrl-btn">' +
            '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
              '<rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>' +
            '</svg>' +
            escapeHtml(data.rangeText) +
          '</button>' +
          '<button type="button" class="ctrl-btn icon-only" aria-label="添加指标">+</button>' +
          '<button type="button" class="ctrl-btn icon-only" aria-label="刷新指标">↻</button>' +
        '</div>' +
      '</div>' +
      '<div class="analytics-grid">' + cardsHtml + '</div>';

    return sec;
  }

  function initWidgets() {
    if (!$extWidgets) return;
    $extWidgets.innerHTML = '';
    $extWidgets.appendChild(createBannerWidget());
    $extWidgets.appendChild(createNoticeWidget());
    $extWidgets.appendChild(createMetricsWidget());
    $extWidgets.hidden = !CONFIG.showWidgets;
    $extWidgets.setAttribute('aria-hidden', CONFIG.showWidgets ? 'false' : 'true');
  }

  /* ---------------- rendering ---------------- */

  function renderSkeletons(n) {
    $grid.innerHTML = '';
    for (let i = 0; i < n; i++) {
      const d = document.createElement('div');
      d.className = 'skeleton';
      $grid.appendChild(d);
    }
  }

  function createCard(page, index) {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = encodePath(page.dir) + '/';
    a.style.animationDelay = Math.min(index, 20) * 20 + 'ms';

    const title = page.title || titleFromDir(page.dir);
    const iconSeed = titleFromDir(page.dir);
    const hue = 195 + (hash(iconSeed) % 90);
    a.style.setProperty('--card-hue', String(hue));

    a.innerHTML =
      '<div class="card-head">' +
        '<div class="card-icon">' + escapeHtml(initialOf(iconSeed)) + '</div>' +
        '<div class="card-body">' +
          '<div class="card-title" data-role="title">' + escapeHtml(title) + '</div>' +
          '<p class="card-desc" data-role="desc"' + (page.desc ? '' : ' hidden') + '>' + escapeHtml(page.desc || '') + '</p>' +
        '</div>' +
      '</div>' +
      '<div class="card-foot">' +
        '<span class="card-path">' + escapeHtml(page.dir) + '/</span>' +
        '<span class="card-arrow">→</span>' +
      '</div>';

    return a;
  }

  function renderCards() {
    $grid.innerHTML = '';
    cardEls = [];
    const frag = document.createDocumentFragment();
    for (let i = 0; i < state.pages.length; i++) {
      const card = createCard(state.pages[i], i);
      frag.appendChild(card);
      cardEls.push(card);
    }
    $grid.appendChild(frag);
  }

  function updateCardText(index) {
    const card = cardEls[index];
    const page = state.pages[index];
    if (!card || !page) return;
    const titleEl = card.querySelector('[data-role="title"]');
    const descEl = card.querySelector('[data-role="desc"]');
    if (titleEl) titleEl.textContent = page.title || titleFromDir(page.dir);
    if (descEl) {
      if (page.desc) { descEl.textContent = page.desc; descEl.hidden = false; }
      else descEl.hidden = true;
    }
  }

  function applyFilter() {
    const q = ($search.value || '').trim().toLowerCase();
    let visible = 0;

    for (let i = 0; i < state.pages.length; i++) {
      const card = cardEls[i];
      if (!card) continue;
      const p = state.pages[i];
      const hay = ((p.title || '') + ' ' + p.dir + ' ' + (p.desc || '')).toLowerCase();
      const hit = !q || hay.indexOf(q) !== -1;
      card.style.display = hit ? '' : 'none';
      if (hit) visible++;
    }

    $count.textContent = q ? visible + ' / ' + state.pages.length : state.pages.length + ' 个页面';
    $noresult.hidden = !(q && visible === 0 && state.pages.length > 0);
    $grid.hidden = visible === 0 && state.pages.length > 0;
  }

  function updateMetaTime() {
    if (!state.scannedAt) { $meta.textContent = ''; return; }
    const d = new Date(state.scannedAt);
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    $meta.textContent = hh + ':' + mm;
  }

  function render() {
    $empty.hidden = true;
    $noresult.hidden = true;
    $error.hidden = true;

    if (state.loading) {
      $grid.hidden = false;
      renderSkeletons(8);
      $count.textContent = '扫描中…';
      $meta.textContent = '';
      return;
    }

    if (state.error) {
      $grid.hidden = true;
      $grid.innerHTML = '';
      $error.hidden = false;
      $errorMsg.textContent = state.error;
      $count.textContent = '—';
      $meta.textContent = '';
      return;
    }

    if (state.pages.length === 0) {
      $grid.hidden = true;
      $grid.innerHTML = '';
      $empty.hidden = false;
      $count.textContent = '0 个页面';
      $meta.textContent = '';
      return;
    }

    $grid.hidden = false;
    renderCards();
    applyFilter();
    updateMetaTime();
  }

  /* ---------------- main flow ---------------- */

  async function scan() {
    state.loading = true;
    state.error = null;
    state.pages = [];
    render();

    let entries;
    try { entries = await findPages(); }
    catch (err) {
      state.loading = false;
      state.error = err && err.message ? err.message : String(err);
      render();
      return;
    }

    if (!entries.length) {
      state.loading = false;
      state.pages = [];
      state.scannedAt = Date.now();
      render();
      return;
    }

    state.pages = entries.map(function (e) {
      return { dir: e.dir, title: e.title || '', desc: e.desc || '' };
    });
    state.loading = false;
    render();

    let done = 0;
    const total = state.pages.length;

    await mapLimit(entries, CONFIG.concurrency, async function (entry, index) {
      if (!state.pages[index].title) {
        const meta = await fetchMeta(entry.dir);
        if (meta.title) state.pages[index].title = meta.title;
        if (meta.desc) state.pages[index].desc = meta.desc;
      }
      done++;
      updateCardText(index);
      $meta.textContent = done + '/' + total;
    });

    state.scannedAt = Date.now();
    applyFilter();
    updateMetaTime();
    writeCache();
  }

  async function boot() {
    $grid = document.getElementById('grid');
    $count = document.getElementById('count');
    $meta = document.getElementById('meta');
    $empty = document.getElementById('empty');
    $noresult = document.getElementById('noresult');
    $error = document.getElementById('error');
    $errorMsg = document.getElementById('error-msg');
    $search = document.getElementById('search-input');
    $extWidgets = document.getElementById('ext-widgets');
    $readmeSection = document.getElementById('readme-section');
    $readmeContent = document.getElementById('readme-content');
    $readmeToggle = document.getElementById('readme-toggle');

    initTheme();
    renderBrand();
    initWidgets();
    initReadmeToggle();
    loadReadme();

    $search.addEventListener('input', applyFilter);

    $grid.addEventListener('pointermove', function (e) {
      const card = e.target.closest ? e.target.closest('.card') : null;
      if (!card) return;
      const rect = card.getBoundingClientRect();
      card.style.setProperty('--mx', (e.clientX - rect.left) + 'px');
      card.style.setProperty('--my', (e.clientY - rect.top) + 'px');
    });

    document.addEventListener('keydown', function (e) {
      const tag = (document.activeElement && document.activeElement.tagName) || '';
      const typing = tag === 'INPUT' || tag === 'TEXTAREA';
      if (e.key === '/' && !typing) { e.preventDefault(); $search.focus(); }
      if (e.key === 'Escape' && document.activeElement === $search) {
        $search.value = '';
        $search.blur();
        applyFilter();
      }
    });

    const refreshBtn = document.getElementById('refresh-btn');
    refreshBtn.addEventListener('click', async function () {
      if (refreshBtn.disabled) return;
      refreshBtn.disabled = true;
      refreshBtn.classList.add('spinning');
      try { localStorage.removeItem(CACHE_KEY); } catch (e) {}
      await scan();
      refreshBtn.disabled = false;
      refreshBtn.classList.remove('spinning');
    });

    document.getElementById('retry-btn').addEventListener('click', function () {
      try { localStorage.removeItem(CACHE_KEY); } catch (e) {}
      scan();
    });

    const cached = readCache();
    if (cached) {
      state.pages = cached.pages;
      state.scannedAt = cached.time;
      state.loading = false;
      render();
      return;
    }

    await scan();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
