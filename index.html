<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>页面索引 · Pages Index</title>

<style>
/* ============ 设计变量 ============ */
:root{
  --bg:#f6f7f9;
  --glow-1:rgba(99,102,241,.14);
  --glow-2:rgba(6,182,212,.12);
  --surface:#ffffff;
  --surface-2:#f2f4f7;
  --border:#e6e8ee;
  --header-bg:rgba(255,255,255,.72);
  --text:#0f1222;
  --text-2:#5b6478;
  --text-3:#8b93a7;
  --accent:#4f46e5;
  --accent-2:#06b6d4;
  --shadow-sm:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  --shadow-lg:0 14px 36px -10px rgba(16,24,40,.18),0 4px 12px -4px rgba(16,24,40,.08);
  --radius:16px;
}
[data-theme="dark"]{
  --bg:#0a0c10;
  --glow-1:rgba(99,102,241,.20);
  --glow-2:rgba(6,182,212,.14);
  --surface:#12151b;
  --surface-2:#191d25;
  --border:#232a35;
  --header-bg:rgba(10,12,16,.72);
  --text:#eef1f6;
  --text-2:#9aa4b8;
  --text-3:#6b7488;
  --accent:#818cf8;
  --accent-2:#22d3ee;
  --shadow-sm:0 1px 2px rgba(0,0,0,.45);
  --shadow-lg:0 18px 44px -14px rgba(0,0,0,.7);
}

/* ============ 基础 ============ */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  background-color:var(--bg);
  color:var(--text);
  font-size:14px;
  line-height:1.6;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  transition:background-color .3s ease,color .3s ease;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background:
    radial-gradient(900px 520px at 12% -12%, var(--glow-1), transparent 65%),
    radial-gradient(820px 520px at 92% -8%, var(--glow-2), transparent 65%);
}
a{color:inherit;text-decoration:none}
button{font-family:inherit}

/* ============ 顶栏 ============ */
.topbar{
  position:sticky;
  top:0;
  z-index:100;
  background:var(--header-bg);
  backdrop-filter:saturate(180%) blur(18px);
  -webkit-backdrop-filter:saturate(180%) blur(18px);
  border-bottom:1px solid var(--border);
}
.topbar-inner{
  max-width:1240px;
  margin:0 auto;
  padding:13px 24px;
  display:flex;
  align-items:center;
  gap:12px;
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-mark{
  width:38px;height:38px;flex:0 0 auto;
  border-radius:11px;
  background:linear-gradient(135deg,#6366f1,#06b6d4);
  color:#fff;
  display:grid;place-items:center;
  box-shadow:0 8px 20px -8px rgba(99,102,241,.85);
}
.brand h1{
  margin:0;
  font-size:15.5px;
  font-weight:650;
  letter-spacing:-.01em;
  line-height:1.25;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.brand-sub{
  margin:0;
  font-size:10.5px;
  font-weight:500;
  letter-spacing:.09em;
  text-transform:uppercase;
  color:var(--text-3);
  line-height:1.3;
}

/* 搜索 */
.search{
  position:relative;
  flex:1;
  max-width:380px;
  margin-left:auto;
}
.search .s-icon{
  position:absolute;
  left:12px;
  top:50%;
  transform:translateY(-50%);
  color:var(--text-3);
  pointer-events:none;
  display:flex;
}
.search input{
  width:100%;
  height:40px;
  padding:0 44px 0 38px;
  border-radius:11px;
  border:1px solid var(--border);
  background:var(--surface-2);
  color:var(--text);
  font-size:13.5px;
  font-family:inherit;
  outline:none;
  transition:border-color .2s,background .2s,box-shadow .2s;
  -webkit-appearance:none;
}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.search input::placeholder{color:var(--text-3)}
.search input:focus{
  background:var(--surface);
  border-color:var(--accent);
  box-shadow:0 0 0 3.5px color-mix(in srgb, var(--accent) 15%, transparent);
}
.search kbd{
  position:absolute;
  right:9px;
  top:50%;
  transform:translateY(-50%);
  font-size:11px;
  line-height:1;
  padding:3px 6px;
  border-radius:5px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text-3);
  font-family:inherit;
  pointer-events:none;
}

/* 图标按钮 */
.icon-btn{
  width:40px;height:40px;
  flex:0 0 auto;
  display:grid;place-items:center;
  border-radius:11px;
  border:1px solid var(--border);
  background:var(--surface-2);
  color:var(--text-2);
  cursor:pointer;
  transition:background .2s,color .2s,border-color .2s,transform .15s;
}
.icon-btn:hover{background:var(--surface);color:var(--text);border-color:var(--text-3)}
.icon-btn:active{transform:scale(.94)}
.icon-btn:disabled{cursor:default;opacity:.6}
.icon-btn.spinning svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.icon-sun{display:none}
[data-theme="dark"] .icon-sun{display:block}
[data-theme="dark"] .icon-moon{display:none}

/* ============ 主体 ============ */
.container{
  max-width:1240px;
  margin:0 auto;
  padding:30px 24px 72px;
}
.toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
  margin-bottom:20px;
}
.toolbar-left{display:flex;align-items:center;gap:10px;min-width:0}
.toolbar-left h2{
  margin:0;
  font-size:20px;
  font-weight:680;
  letter-spacing:-.02em;
}
.count{
  font-size:12px;
  font-weight:550;
  color:var(--text-2);
  background:var(--surface-2);
  border:1px solid var(--border);
  padding:3px 10px;
  border-radius:999px;
  white-space:nowrap;
}
.toolbar-right{
  font-size:12px;
  color:var(--text-3);
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}

/* ============ 卡片网格 ============ */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(272px,1fr));
  gap:16px;
}
.card{
  position:relative;
  display:flex;
  flex-direction:column;
  gap:16px;
  padding:18px;
  border-radius:var(--radius);
  border:1px solid var(--border);
  background:var(--surface);
  box-shadow:var(--shadow-sm);
  transition:transform .24s cubic-bezier(.2,.8,.2,1),
             box-shadow .24s cubic-bezier(.2,.8,.2,1),
             border-color .24s;
  overflow:hidden;
  animation:fadeUp .45s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}
.card::before{
  content:"";
  position:absolute;
  top:0;left:0;right:0;
  height:2px;
  background:linear-gradient(90deg,var(--accent),var(--accent-2));
  opacity:0;
  transition:opacity .24s;
}
.card:hover{
  transform:translateY(-4px);
  box-shadow:var(--shadow-lg);
  border-color:color-mix(in srgb, var(--accent) 42%, var(--border));
}
.card:hover::before{opacity:1}
.card:active{transform:translateY(-1px) scale(.994)}
.card:focus-visible{
  outline:none;
  box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent);
}

.card-head{display:flex;gap:12px;align-items:flex-start}
.card-icon{
  width:40px;height:40px;
  flex:0 0 auto;
  border-radius:12px;
  display:grid;place-items:center;
  color:#fff;
  font-size:16px;
  font-weight:700;
  line-height:1;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.2),0 4px 12px -6px rgba(0,0,0,.5);
  user-select:none;
}
.card-body{min-width:0;flex:1}
.card-title{
  font-size:14.5px;
  font-weight:600;
  letter-spacing:-.01em;
  line-height:1.45;
  color:var(--text);
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  word-break:break-word;
}
.card-desc{
  margin:4px 0 0;
  font-size:12.5px;
  line-height:1.55;
  color:var(--text-2);
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  word-break:break-word;
}
.card-foot{
  margin-top:auto;
  display:flex;
  align-items:center;
  gap:8px;
  font-size:11.5px;
  color:var(--text-3);
  font-family:ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace;
  min-width:0;
}
.card-path{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  min-width:0;
}
.card-arrow{
  margin-left:auto;
  flex:0 0 auto;
  color:var(--accent);
  font-family:inherit;
  transition:transform .24s cubic-bezier(.2,.8,.2,1);
}
.card:hover .card-arrow{transform:translateX(3px)}

/* ============ 骨架屏 ============ */
.skeleton{
  height:118px;
  border-radius:var(--radius);
  border:1px solid var(--border);
  background:var(--surface);
  position:relative;
  overflow:hidden;
}
.skeleton::after{
  content:"";
  position:absolute;
  inset:0;
  transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,var(--surface-2),transparent);
  animation:shimmer 1.5s infinite;
}
@keyframes shimmer{100%{transform:translateX(100%)}}

/* ============ 状态框 ============ */
.state-box{
  text-align:center;
  padding:72px 24px;
  border-radius:var(--radius);
  border:1px dashed var(--border);
  background:color-mix(in srgb, var(--surface) 60%, transparent);
}
.state-box h3{
  margin:0 0 8px;
  font-size:16px;
  font-weight:650;
}
.state-box p{
  margin:0 auto;
  max-width:460px;
  font-size:13.5px;
  color:var(--text-2);
  line-height:1.7;
}
.state-icon{
  font-size:26px;
  line-height:1;
  margin-bottom:14px;
  opacity:.85;
}
.state-box .hint{
  margin-top:14px;
  font-size:12.5px;
  color:var(--text-3);
}
.state-box code{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:12px;
  padding:1.5px 5px;
  border-radius:5px;
  background:var(--surface-2);
  border:1px solid var(--border);
  color:var(--text-2);
}
.btn{
  margin-top:20px;
  height:36px;
  padding:0 18px;
  border-radius:10px;
  border:1px solid transparent;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;
  font-size:13.5px;
  font-weight:600;
  cursor:pointer;
  transition:opacity .2s,transform .15s;
  box-shadow:0 8px 20px -10px color-mix(in srgb,var(--accent) 90%,transparent);
}
.btn:hover{opacity:.92}
.btn:active{transform:scale(.97)}

/* ============ 页脚 ============ */
.footer{
  max-width:1240px;
  margin:0 auto;
  padding:0 24px 40px;
  font-size:12px;
  color:var(--text-3);
  display:flex;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
}

/* ============ 响应式 ============ */
@media (max-width:720px){
  .topbar-inner{flex-wrap:wrap;padding:12px 16px;gap:10px}
  .search{order:3;flex-basis:100%;max-width:none;margin-left:0}
  .icon-btn{width:38px;height:38px}
  .brand{margin-right:auto}
  .container{padding:22px 16px 56px}
  .toolbar-left h2{font-size:18px}
  .grid{grid-template-columns:1fr;gap:12px}
  .footer{padding:0 16px 32px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>

<body>

<!-- ================= 顶栏 ================= -->
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
      </div>
      <div>
        <h1 id="site-title">页面索引</h1>
        <p class="brand-sub" id="site-sub">Pages Index</p>
      </div>
    </div>

    <div class="search">
      <span class="s-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
        </svg>
      </span>
      <input id="search-input" type="search" placeholder="搜索页面标题或路径…" autocomplete="off" spellcheck="false" aria-label="搜索页面">
      <kbd>/</kbd>
    </div>

    <button class="icon-btn" id="refresh-btn" title="重新扫描" aria-label="重新扫描">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>
      </svg>
    </button>

    <button class="icon-btn" id="theme-btn" title="切换主题" aria-label="切换主题">
      <svg class="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
      <svg class="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="4.2"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
    </button>
  </div>
</header>

<!-- ================= 主体 ================= -->
<main class="container">
  <div class="toolbar">
    <div class="toolbar-left">
      <h2>全部页面</h2>
      <span class="count" id="count">—</span>
    </div>
    <div class="toolbar-right" id="meta"></div>
  </div>

  <div id="grid" class="grid"></div>

  <div id="empty" class="state-box" hidden>
    <div class="state-icon">📂</div>
    <h3>还没有可索引的页面</h3>
    <p>把带 <code>index.html</code> 的文件夹放到仓库里，刷新一下就能看到。</p>
  </div>

  <div id="noresult" class="state-box" hidden>
    <div class="state-icon">🔍</div>
    <h3>没有匹配的页面</h3>
    <p>换个关键词试试，或者清空搜索框。</p>
  </div>

  <div id="error" class="state-box" hidden>
    <div class="state-icon">⚠️</div>
    <h3>无法自动扫描</h3>
    <p id="error-msg"></p>
    <p class="hint">
      请在文件顶部 <code>CONFIG</code> 中填写 <code>owner</code> / <code>repo</code>，
      或在仓库根目录放置一个 <code>pages.json</code> 手动列出页面。
    </p>
    <button class="btn" id="retry-btn">重试</button>
  </div>
</main>

<footer class="footer">
  <span id="footer-left">自动扫描子目录中的入口文件</span>
  <span id="footer-right"></span>
</footer>

<script>
(function () {
  'use strict';

  /* =========================================================
   *  配置区 —— 一般只需要改这里
   * ========================================================= */
  const CONFIG = {
    // 站点标题（显示在左上角）
    siteTitle: '页面索引',
    siteSubtitle: 'Pages Index',

    // GitHub 仓库信息。留空会自动从 *.github.io 地址推断
    owner: '',
    repo: '',
    branch: '',            // 留空自动尝试 main / master

    // 判定为「入口文件」的文件名（不区分大小写）
    entryFiles: ['index.html', 'index.htm'],

    // 扫描时忽略的目录名（不区分大小写），以 . 开头的目录一律忽略
    ignoreDirs: ['node_modules', 'dist', 'build', 'vendor', '.git', '.github', '.idea', '.vscode'],

    // 最大目录深度
    maxDepth: 8,

    // 并发请求数
    concurrency: 8,

    // 结果缓存时长（分钟）
    cacheMinutes: 30
  };
  /* ========================================================= */

  const CACHE_KEY = 'pages-index:cache:v1';
  const THEME_KEY = 'pages-index:theme';

  const state = {
    pages: [],          // [{ dir, title, desc }]
    loading: true,
    error: null,
    scannedAt: 0
  };

  let cardEls = [];
  let $grid, $count, $meta, $empty, $noresult, $error, $errorMsg, $search;

  /* ---------------- 工具函数 ---------------- */

  const escapeHtml = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));

  function hash(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
    return Math.abs(h);
  }

  const PALETTE = [
    ['#6366f1', '#8b5cf6'],
    ['#0ea5e9', '#06b6d4'],
    ['#f59e0b', '#ef4444'],
    ['#10b981', '#14b8a6'],
    ['#ec4899', '#f43f5e'],
    ['#8b5cf6', '#d946ef'],
    ['#3b82f6', '#2dd4bf'],
    ['#f97316', '#fbbf24']
  ];

  function gradientFor(seed) {
    const p = PALETTE[hash(seed) % PALETTE.length];
    return 'linear-gradient(135deg,' + p[0] + ',' + p[1] + ')';
  }

  function initialOf(str) {
    const s = String(str || '').trim();
    if (!s) return '#';
    const ch = s[0];
    return /[\u4e00-\u9fa5]/.test(ch) ? ch : ch.toUpperCase();
  }

  function titleFromDir(dir) {
    const segs = String(dir || '').split('/').filter(Boolean);
    return segs.length ? segs[segs.length - 1] : dir;
  }

  function encodePath(p) {
    return p.split('/').map(encodeURIComponent).join('/');
  }

  async function fetchWithTimeout(url, ms, opts) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), ms || 15000);
    try {
      return await fetch(url, Object.assign({}, opts, { signal: ctrl.signal }));
    } finally {
      clearTimeout(timer);
    }
  }

  async function mapLimit(items, limit, fn) {
    let i = 0;
    const workers = Array.from(
      { length: Math.min(limit, items.length) },
      async function () {
        while (true) {
          const idx = i++;
          if (idx >= items.length) return;
          await fn(items[idx], idx);
        }
      }
    );
    await Promise.all(workers);
  }

  /* ---------------- 主题 ---------------- */

  function setTheme(t) {
    document.documentElement.dataset.theme = t;
  }

  function initTheme() {
    let saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
    const sys = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
      ? 'dark' : 'light';
    setTheme(saved || sys);

    document.getElementById('theme-btn').addEventListener('click', function () {
      const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      setTheme(next);
      try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    });
  }

  /* ---------------- 仓库定位 ---------------- */

  function resolveRepo() {
    let owner = (CONFIG.owner || '').trim();
    let repo = (CONFIG.repo || '').trim();
    if (owner && repo) return { owner: owner, repo: repo };

    const host = location.hostname;
    const segs = location.pathname.split('/').filter(Boolean);

    if (/\.github\.io$/i.test(host)) {
      const sub = host.replace(/\.github\.io$/i, '');
      if (!owner) owner = sub;
      if (!repo) repo = segs.length > 0 ? segs[0] : (sub + '.github.io');
      return { owner: owner, repo: repo };
    }
    return { owner: owner, repo: repo };
  }

  /* ---------------- 扫描 ---------------- */

  async function fetchTree(owner, repo) {
    const branches = CONFIG.branch ? [CONFIG.branch] : ['main', 'master'];
    let lastErr = null;

    for (let i = 0; i < branches.length; i++) {
      const br = branches[i];
      const url = 'https://api.github.com/repos/' +
        encodeURIComponent(owner) + '/' + encodeURIComponent(repo) +
        '/git/trees/' + encodeURIComponent(br) + '?recursive=1';

      let res;
      try {
        res = await fetchWithTimeout(url, 15000, {
          headers: { 'Accept': 'application/vnd.github+json' }
        });
      } catch (e) {
        lastErr = new Error('网络请求失败：' + e.message);
        continue;
      }

      if (res.ok) {
        const data = await res.json();
        if (data.truncated) console.warn('[pages-index] 仓库文件树过大，结果可能被截断');
        return (data.tree || [])
          .filter(function (t) { return t.type === 'blob'; })
          .map(function (t) { return t.path; });
      }

      if (res.status === 403 || res.status === 429) {
        lastErr = new Error('GitHub API 触发速率限制（匿名请求每小时 60 次），请稍后再试。');
      } else if (res.status === 404) {
        lastErr = new Error('仓库或分支不存在：' + owner + '/' + repo + ' @ ' + br);
      } else {
        lastErr = new Error('GitHub API 返回 HTTP ' + res.status);
      }
    }
    throw lastErr || new Error('无法读取仓库文件树');
  }

  function pathsToPages(paths) {
    const seen = Object.create(null);
    const out = [];

    for (let i = 0; i < paths.length; i++) {
      const segs = String(paths[i]).split('/');
      const file = segs.pop().toLowerCase();

      if (CONFIG.entryFiles.indexOf(file) === -1) continue;
      if (segs.length === 0) continue;                 // 根目录的 index.html 就是本页
      if (segs.length > CONFIG.maxDepth) continue;

      let skip = false;
      for (let j = 0; j < segs.length; j++) {
        const s = segs[j];
        if (s.charAt(0) === '.' || CONFIG.ignoreDirs.indexOf(s.toLowerCase()) !== -1) {
          skip = true;
          break;
        }
      }
      if (skip) continue;

      const dir = segs.join('/');
      if (seen[dir]) continue;
      seen[dir] = true;
      out.push({ dir: dir, title: '', desc: '' });
    }

    out.sort(function (a, b) {
      return a.dir.localeCompare(b.dir, 'zh-Hans-CN', { numeric: true });
    });
    return out;
  }

  async function loadManifest() {
    let res;
    try {
      res = await fetchWithTimeout('pages.json', 8000, { cache: 'no-cache' });
    } catch (e) {
      throw new Error('未找到 pages.json');
    }
    if (!res.ok) throw new Error('未找到 pages.json');

    let data;
    try {
      data = await res.json();
    } catch (e) {
      throw new Error('pages.json 格式不是合法 JSON');
    }

    const arr = Array.isArray(data) ? data : (data && data.pages) || [];
    return arr.map(function (item) {
      if (typeof item === 'string') {
        return { dir: item.replace(/^\.?\//, '').replace(/\/$/, ''), title: '', desc: '' };
      }
      return {
        dir: String(item.path != null ? item.path : (item.dir || ''))
          .replace(/^\.?\//, '').replace(/\/$/, ''),
        title: item.title || '',
        desc: item.desc || item.description || ''
      };
    }).filter(function (x) { return !!x.dir; });
  }

  async function findPages() {
    const r = resolveRepo();
    if (r.owner && r.repo) {
      try {
        const paths = await fetchTree(r.owner, r.repo);
        return pathsToPages(paths);
      } catch (err) {
        // GitHub API 不可用时，尝试降级到 pages.json
        try {
          return await loadManifest();
        } catch (e2) {
          throw err;
        }
      }
    }
    return await loadManifest();
  }

  /* ---------------- 读取页面标题 ---------------- */

  async function fetchMeta(dir) {
    for (let i = 0; i < CONFIG.entryFiles.length; i++) {
      const name = CONFIG.entryFiles[i];
      const url = encodePath(dir) + '/' + name;

      let res;
      try {
        res = await fetchWithTimeout(url, 15000);
      } catch (e) {
        continue;
      }
      if (!res.ok) continue;

      let html;
      try {
        html = await res.text();
      } catch (e) {
        continue;
      }

      try {
        const doc = new DOMParser().parseFromString(html, 'text/html');
        let title = (doc.title || '').trim();

        if (!title) {
          const h1 = doc.querySelector('h1');
          if (h1) title = (h1.textContent || '').trim();
        }

        const metaDesc = doc.querySelector('meta[name="description"]');
        const desc = metaDesc ? (metaDesc.getAttribute('content') || '').trim() : '';

        return { title: title, desc: desc };
      } catch (e) {
        return { title: '', desc: '' };
      }
    }
    return { title: '', desc: '' };
  }

  /* ---------------- 缓存 ---------------- */

  function cacheScope() {
    return location.origin + location.pathname;
  }

  function readCache() {
    try {
      const raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      const obj = JSON.parse(raw);
      if (!obj || obj.scope !== cacheScope()) return null;
      if (Date.now() - obj.time > CONFIG.cacheMinutes * 60000) return null;
      if (!Array.isArray(obj.pages) || obj.pages.length === 0) return null;
      return obj;
    } catch (e) {
      return null;
    }
  }

  function writeCache() {
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({
        scope: cacheScope(),
        time: Date.now(),
        pages: state.pages
      }));
    } catch (e) {}
  }

  /* ---------------- 渲染 ---------------- */

  function renderSkeletons(n) {
    $grid.innerHTML = '';
    for (let i = 0; i < n; i++) {
      const d = document.createElement('div');
      d.className = 'skeleton';
      $grid.appendChild(d);
    }
  }

  function createCard(page, index) {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = encodePath(page.dir) + '/';
    a.style.animationDelay = Math.min(index, 20) * 22 + 'ms';

    const title = page.title || titleFromDir(page.dir);
    const iconSeed = titleFromDir(page.dir);

    a.innerHTML =
      '<div class="card-head">' +
        '<div class="card-icon" style="background:' + gradientFor(iconSeed) + '">' +
          escapeHtml(initialOf(iconSeed)) +
        '</div>' +
        '<div class="card-body">' +
          '<div class="card-title" data-role="title">' + escapeHtml(title) + '</div>' +
          '<p class="card-desc" data-role="desc"' + (page.desc ? '' : ' hidden') + '>' +
            escapeHtml(page.desc || '') +
          '</p>' +
        '</div>' +
      '</div>' +
      '<div class="card-foot">' +
        '<span class="card-path">' + escapeHtml(page.dir) + '/</span>' +
        '<span class="card-arrow">→</span>' +
      '</div>';

    return a;
  }

  function renderCards() {
    $grid.innerHTML = '';
    cardEls = [];
    const frag = document.createDocumentFragment();

    for (let i = 0; i < state.pages.length; i++) {
      const card = createCard(state.pages[i], i);
      frag.appendChild(card);
      cardEls.push(card);
    }
    $grid.appendChild(frag);
  }

  function updateCardText(index) {
    const card = cardEls[index];
    const page = state.pages[index];
    if (!card || !page) return;

    const titleEl = card.querySelector('[data-role="title"]');
    const descEl = card.querySelector('[data-role="desc"]');
    const title = page.title || titleFromDir(page.dir);

    if (titleEl) titleEl.textContent = title;
    if (descEl) {
      if (page.desc) {
        descEl.textContent = page.desc;
        descEl.hidden = false;
      } else {
        descEl.hidden = true;
      }
    }
  }

  function applyFilter() {
    const q = ($search.value || '').trim().toLowerCase();
    let visible = 0;

    for (let i = 0; i < state.pages.length; i++) {
      const card = cardEls[i];
      if (!card) continue;
      const p = state.pages[i];
      const hay = ((p.title || '') + ' ' + p.dir + ' ' + (p.desc || '')).toLowerCase();
      const hit = !q || hay.indexOf(q) !== -1;

      card.style.display = hit ? '' : 'none';
      if (hit) visible++;
    }

    if (q) {
      $count.textContent = visible + ' / ' + state.pages.length;
    } else {
      $count.textContent = state.pages.length + ' 个页面';
    }

    $noresult.hidden = !(q && visible === 0 && state.pages.length > 0);
    $grid.hidden = visible === 0 && state.pages.length > 0;
  }

  function updateMetaTime() {
    if (!state.scannedAt) {
      $meta.textContent = '';
      return;
    }
    const d = new Date(state.scannedAt);
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    $meta.textContent = '更新于 ' + hh + ':' + mm;
  }

  function render() {
    $empty.hidden = true;
    $noresult.hidden = true;
    $error.hidden = true;

    if (state.loading) {
      $grid.hidden = false;
      renderSkeletons(8);
      $count.textContent = '扫描中…';
      $meta.textContent = '';
      return;
    }

    if (state.error) {
      $grid.hidden = true;
      $grid.innerHTML = '';
      $error.hidden = false;
      $errorMsg.textContent = state.error;
      $count.textContent = '—';
      $meta.textContent = '';
      return;
    }

    if (state.pages.length === 0) {
      $grid.hidden = true;
      $grid.innerHTML = '';
      $empty.hidden = false;
      $count.textContent = '0 个页面';
      $meta.textContent = '';
      return;
    }

    $grid.hidden = false;
    renderCards();
    applyFilter();
    updateMetaTime();
  }

  /* ---------------- 主流程 ---------------- */

  async function scan() {
    state.loading = true;
    state.error = null;
    state.pages = [];
    render();

    let entries;
    try {
      entries = await findPages();
    } catch (err) {
      state.loading = false;
      state.error = err && err.message ? err.message : String(err);
      render();
      return;
    }

    if (!entries.length) {
      state.loading = false;
      state.pages = [];
      state.scannedAt = Date.now();
      render();
      return;
    }

    // 先渲染占位卡片，标题逐个回填（渐进式）
    state.pages = entries.map(function (e) {
      return { dir: e.dir, title: e.title || '', desc: e.desc || '' };
    });
    state.loading = false;
    render();

    let done = 0;
    const total = state.pages.length;

    await mapLimit(entries, CONFIG.concurrency, async function (entry, index) {
      // pages.json 里已经带了标题就不用再抓
      if (!state.pages[index].title) {
        const meta = await fetchMeta(entry.dir);
        if (meta.title) state.pages[index].title = meta.title;
        if (meta.desc) state.pages[index].desc = meta.desc;
      }
      done++;
      updateCardText(index);
      $meta.textContent = '正在读取页面信息 ' + done + '/' + total;
    });

    state.scannedAt = Date.now();
    applyFilter();
    updateMetaTime();
    writeCache();
  }

  async function boot() {
    $grid = document.getElementById('grid');
    $count = document.getElementById('count');
    $meta = document.getElementById('meta');
    $empty = document.getElementById('empty');
    $noresult = document.getElementById('noresult');
    $error = document.getElementById('error');
    $errorMsg = document.getElementById('error-msg');
    $search = document.getElementById('search-input');

    document.title = CONFIG.siteTitle + ' · ' + CONFIG.siteSubtitle;
    document.getElementById('site-title').textContent = CONFIG.siteTitle;
    document.getElementById('site-sub').textContent = CONFIG.siteSubtitle;

    initTheme();

    // 搜索
    $search.addEventListener('input', applyFilter);

    // 快捷键
    document.addEventListener('keydown', function (e) {
      const tag = (document.activeElement && document.activeElement.tagName) || '';
      const typing = tag === 'INPUT' || tag === 'TEXTAREA';

      if (e.key === '/' && !typing) {
        e.preventDefault();
        $search.focus();
      }
      if (e.key === 'Escape' && document.activeElement === $search) {
        $search.value = '';
        $search.blur();
        applyFilter();
      }
    });

    // 刷新
    const refreshBtn = document.getElementById('refresh-btn');
    refreshBtn.addEventListener('click', async function () {
      if (refreshBtn.disabled) return;
      refreshBtn.disabled = true;
      refreshBtn.classList.add('spinning');
      try { localStorage.removeItem(CACHE_KEY); } catch (e) {}
      await scan();
      refreshBtn.disabled = false;
      refreshBtn.classList.remove('spinning');
    });

    // 重试
    document.getElementById('retry-btn').addEventListener('click', function () {
      try { localStorage.removeItem(CACHE_KEY); } catch (e) {}
      scan();
    });

    // 优先使用缓存
    const cached = readCache();
    if (cached) {
      state.pages = cached.pages;
      state.scannedAt = cached.time;
      state.loading = false;
      render();
      return;
    }

    await scan();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
